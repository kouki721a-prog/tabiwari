<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>たびわり</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f2742">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="たびわり">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
/* Layout idea: one column phone app. A navy boarding-pass card shows what is left; amber is the single action colour; bottom tab bar. */
:root{
  --paper:#eef2f7; --card:#ffffff; --ink:#0e2238; --sub:#5b6b80; --line:#dde4ee; --soft:#e6ecf5;
  --navy:#0f2742; --sun:#ffc83d; --sun-ink:#2a1d00; --good:#17895c; --bad:#d6403a; --focus:#2f6fed;
  --tbs:85%; --tbl:92%; --tfs:55%; --tfl:30%;
  --font:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0a1626; --card:#12243a; --ink:#e9f0fa; --sub:#93a3b8; --line:#243750; --soft:#1a2f4a;
    --navy:#17375e; --good:#4cc795; --bad:#ff7a73; --focus:#7aa2ff;
    --tbs:38%; --tbl:24%; --tfs:75%; --tfl:82%; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0a1626; --card:#12243a; --ink:#e9f0fa; --sub:#93a3b8; --line:#243750; --soft:#1a2f4a;
  --navy:#17375e; --good:#4cc795; --bad:#ff7a73; --focus:#7aa2ff;
  --tbs:38%; --tbl:24%; --tfs:75%; --tfl:82%; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-weight:400;line-height:1.55;font-variant-numeric:tabular-nums}
b,strong{font-weight:500}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
#app{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 8px) 16px calc(env(safe-area-inset-bottom) * .5 + 84px)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.sub{color:var(--sub);font-size:13px}
.sm{font-size:12px}
.num{font-weight:700;font-size:18px}
.right{text-align:right}

/* header */
.brand{font-size:30px;font-weight:700;letter-spacing:.02em;margin:6px 0 2px}
#app.fit{height:100%;overflow:hidden;display:flex;flex-direction:column;padding-bottom:0}
#app.fit>*{flex:none}
#app.fit>.sp{display:block;flex:10 1 0;min-height:6px;max-height:24px}
#app.fit>.scroll{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;margin:0 -16px;padding:0 16px 8px}
#app.nonav{padding-bottom:calc(env(safe-area-inset-bottom) * .5 + 10px)}
.cta{padding-top:10px}
.scroll>.lab:first-child{margin-top:6px}
.scroll>.lab,.scroll .two .lab{margin-top:14px}
.scroll>.sec:first-child{margin-top:0}
.scroll .sec{margin-top:10px}
.item.slim{padding:6px 12px;gap:10px;line-height:1.4}
.top{display:flex;align-items:center;gap:10px;margin-bottom:0}
.top h1{font-size:18px;font-weight:700;margin:0;flex:1;min-width:0;overflow-wrap:anywhere;text-wrap:balance}
.iconbtn{width:40px;height:40px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.pill{font-size:12px;font-weight:500;padding:3px 10px;border-radius:99px;white-space:nowrap;background:var(--soft);color:var(--sub)}
.pill.now{background:var(--sun);color:var(--sun-ink)}

/* tags and avatars share one hue system */
.tag,.av{--h:215;background:hsl(var(--h) var(--tbs) var(--tbl));color:hsl(var(--h) var(--tfs) var(--tfl));display:grid;place-items:center;font-weight:700;flex:none}
.tag{width:42px;height:42px;border-radius:14px;font-size:17px}
.av{width:30px;height:30px;border-radius:50%;font-size:14px}
.avs{display:flex}
.avs .av{border:2px solid var(--card);margin-left:-8px}
.avs .av:first-child{margin-left:0}
.pill.wait{background:none;border:1.5px dashed var(--sub);color:var(--sub);padding:1px 9px}

/* home */
.trip{display:block;width:100%;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px 16px;margin-top:10px}
.trip-name{font-size:18px;font-weight:700;overflow-wrap:anywhere}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:12px}
.bar>i{display:block;height:100%;background:var(--navy);border-radius:99px}
.bar.over>i{background:var(--bad)}
.legal a{color:var(--sub)}
.chip .x{width:24px;height:24px;display:grid;place-items:center;color:var(--sub);font-size:18px;line-height:1;margin-left:2px}
.btn.lineg{background:#06c755;color:#fff;width:auto;padding:10px 14px;font-size:14px;flex:none}
.install{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin-top:10px;font-size:13px}
.install .btn{width:auto;padding:8px 14px;font-size:14px;flex:none}
.install .x{width:32px;height:32px;display:grid;place-items:center;color:var(--sub);flex:none}
.empty{text-align:center;padding:34px 12px;color:var(--sub)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}

/* ticket */
.ticket{background:var(--navy);color:#fff;border-radius:24px}
.t-top{padding:12px 20px 10px}
.t-label{font-size:13px;opacity:.75}
.t-amount{font-size:38px;font-weight:700;line-height:1.2;letter-spacing:-.02em}
.t-amount.neg{color:#ff9a92}
.t-bar{height:8px;border-radius:99px;background:rgba(255,255,255,.18);margin-top:8px;overflow:hidden}
.t-bar i{display:block;height:100%;background:var(--sun);border-radius:99px}
.t-bar.over i{background:#ff9a92}
.t-perf{position:relative;height:0;border-top:2px dashed rgba(255,255,255,.28);margin:0 18px}
.t-perf::before,.t-perf::after{content:"";position:absolute;top:-13px;width:24px;height:24px;border-radius:50%;background:var(--paper)}
.t-perf::before{left:-30px}
.t-perf::after{right:-30px}
.t-bot{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:10px 20px 12px}
.t-bot b{display:block;font-size:18px;font-weight:700}
.t-bot .warn{color:#ff9a92}

/* lists */
.sec{margin-top:16px}
.sec>h2{font-size:15px;font-weight:700;margin:0 0 6px;display:flex;justify-content:space-between;align-items:baseline}
.sec>h2 span{font-size:13px;font-weight:500;color:var(--sub)}
.list{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:10px 14px;width:100%;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .t{font-weight:500;overflow-wrap:anywhere}
.item .amt{font-weight:700;white-space:nowrap}
.seg{display:flex;gap:2px;height:12px;border-radius:99px;overflow:hidden;margin:4px 0 12px;background:var(--soft)}
.seg i{background:hsl(var(--h) 70% 55%)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:13px}
.legend div{display:flex;align-items:center;gap:6px}
.legend .dot{width:10px;height:10px;border-radius:50%;background:hsl(var(--h) 70% 55%);flex:none}
.legend em{margin-left:auto;font-style:normal;font-weight:500}
.usage{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px}
.usage .seg{margin:0 0 8px;height:10px}
.legend2{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:12px;color:var(--sub)}
.legend2 span{display:inline-flex;align-items:center;gap:5px}
.legend2 .dot{width:8px;height:8px;border-radius:50%;background:hsl(var(--h) 70% 55%)}
.legend2 b{color:var(--ink)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px}

/* settle */
.xfer{display:flex;align-items:center;gap:10px;padding:8px 14px}
.xfer.done{opacity:.5}
.xfer .names{flex:1;min-width:0;font-weight:500;font-size:14px}
.xfer .amt{font-weight:700;font-size:17px;white-space:nowrap}
.chk{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent;flex:none}
.chk.on{background:var(--good);border-color:var(--good);color:#fff}
.plus-or-minus.pos{color:var(--good)}
.plus-or-minus.neg{color:var(--bad)}

/* buttons / forms */
.btn{display:block;width:100%;background:var(--sun);color:var(--sun-ink);border-radius:16px;padding:15px 18px;font-size:16px;font-weight:700;text-align:center}
.btn.line{background:none;color:var(--ink);border:1.5px solid var(--line);padding:12px 16px;font-size:15px}
.btn.bad{background:var(--bad);color:#fff}
.link{color:var(--sub);font-size:14px;font-weight:500;padding:10px 0;text-align:center;width:100%}
.link.bad{color:var(--bad)}
.field{width:100%;font:inherit;font-size:16px;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.field:focus{border-color:var(--focus);outline:none}
.lab{display:block;font-size:13px;color:var(--sub);font-weight:500;margin:20px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);font-weight:500;font-size:14px}
.chip.plain{padding:9px 14px}
.chip.on{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.chip .av{width:26px;height:26px;font-size:13px}
.catgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.cat{display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 2px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-weight:500;font-size:11px;line-height:1.2;white-space:nowrap}
.cat .tag{width:30px;height:30px;border-radius:10px;font-size:14px}
.cat.on{border-color:var(--ink);border-width:2px}
.err{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad);padding:10px 12px;border-radius:12px;font-size:14px;font-weight:500;margin-top:14px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.two>*{min-width:0}
input[type=date].field{min-width:0;max-width:100%;min-height:50px;-webkit-appearance:none;appearance:none;text-align:left;display:block}
input[type=date].field::-webkit-date-and-time-value{text-align:left}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(5,12,22,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:520px;max-height:97%;display:flex;flex-direction:column;border-radius:26px 26px 0 0;padding:16px 16px 0;overflow:hidden}
.sheet-body{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-bottom:6px}
.sheet-foot{flex:none;padding:8px 0 calc(env(safe-area-inset-bottom) + 14px)}
.sheet .lab{margin:10px 0 5px}
.sheet .field{padding:10px 12px}
.sheet input[type=date].field{min-height:44px}
.sheet .chips{gap:6px}
.sheet .chip{padding:4px 12px 4px 4px;font-size:13px}
.sheet .chip.plain{padding:7px 12px}
.memo-row{display:grid;grid-template-columns:minmax(0,1fr) 148px;gap:8px;margin-top:6px}
.memo-row .field{padding:11px 12px}
.sheet .two .lab{margin-top:10px}
.sheet h2{font-size:18px;font-weight:700;margin:0}
.amount-wrap{display:flex;align-items:baseline;gap:6px;margin-top:6px}
.amount{font:inherit;font-size:38px;font-weight:700;border:0;background:none;color:var(--ink);padding:0;width:100%;min-width:0;letter-spacing:-.02em}
.amount:focus{outline:none}
.amount::placeholder{color:var(--line)}
.amount-wrap span{font-size:22px;font-weight:700}
.hint{min-height:20px;font-size:14px;color:var(--sub);font-weight:500}

/* tab bar */
.nav{position:relative;z-index:10;margin:0 -16px;background:var(--card);border-top:1px solid var(--line);padding-bottom:calc(env(safe-area-inset-bottom) * .4)}
.nav-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 74px 1fr 1fr;align-items:end;padding:4px 8px 2px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 0;font-size:11px;font-weight:500;color:var(--sub)}
.tab.on{color:var(--ink)}
.tab.on svg{stroke-width:2.6}
.plus{width:54px;height:54px;border-radius:50%;background:var(--sun);color:var(--sun-ink);display:grid;place-items:center;margin:-22px auto 4px;box-shadow:0 6px 16px rgba(0,0,0,.22)}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) * .5 + 14px);width:calc(100% - 32px);max-width:488px;box-shadow:0 8px 20px rgba(0,0,0,.22);z-index:10}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 100px);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:99px;font-size:14px;font-weight:500;z-index:40}
textarea.copybox{width:100%;height:110px;font:inherit;font-size:14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:10px}
@media (prefers-reduced-motion: no-preference){
  .sheet{animation:up .22s ease-out}
  @keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
}
</style>
</head>
<body>
<div id="app"></div>
<script src="config.js"></script>
<script src="sync.js"></script>
<script src="share.js"></script>
<script src="line.js"></script>
<script>
/* ===== LOGIC_START (pure functions; tested separately) ===== */
function hashStr(str){   // FNV-1a: the same text gives the same number on every device
  var h = 2166136261; str = String(str || '');
  for (var i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return h >>> 0;
}
/* amount / people, rounded down for everyone; the leftover yen go one each to people picked by rotating from a start point that depends on `seed`
   (the expense id), so the same person is not always the one who pays the extra yen, and every device computes the same result. */
function splitShares(amount, ids, seed){
  var n = ids.length, base = Math.floor(amount / n), rem = amount - base * n;
  var order = ids.slice().sort(), start = hashStr(seed) % n, extra = {};
  for (var k = 0; k < rem; k++) extra[order[(start + k) % n]] = 1;
  return ids.map(function(id){ return [id, base + (extra[id] ? 1 : 0)]; });
}
function calcBalances(trip){
  var paid = {}, owed = {};
  trip.members.forEach(function(m){ paid[m.id] = 0; owed[m.id] = 0; });
  trip.expenses.forEach(function(e){
    if (paid[e.payer] === undefined) return;
    paid[e.payer] += e.amount;
    splitShares(e.amount, e.split, e.id).forEach(function(s){ if (owed[s[0]] !== undefined) owed[s[0]] += s[1]; });
  });
  var net = {};
  trip.members.forEach(function(m){ net[m.id] = paid[m.id] - owed[m.id]; });
  return { paid: paid, owed: owed, net: net };
}
function settle(net){
  var cr = [], db = [];
  Object.keys(net).forEach(function(id){
    if (net[id] > 0) cr.push({id: id, v: net[id]});
    else if (net[id] < 0) db.push({id: id, v: -net[id]});
  });
  var out = [];
  while (cr.length && db.length){
    cr.sort(function(a, b){ return b.v - a.v; });
    db.sort(function(a, b){ return b.v - a.v; });
    var c = cr[0], d = db[0], x = Math.min(c.v, d.v);
    out.push({ from: d.id, to: c.id, amount: x });
    c.v -= x; d.v -= x;
    if (c.v === 0) cr.shift();
    if (d.v === 0) db.shift();
  }
  return out;
}
function dayDiff(a, b){
  var pa = a.split('-').map(Number), pb = b.split('-').map(Number);
  return Math.round((Date.UTC(pb[0], pb[1]-1, pb[2]) - Date.UTC(pa[0], pa[1]-1, pa[2])) / 86400000);
}
function parseYen(s){
  s = String(s).replace(/[０-９]/g, function(c){ return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); }).replace(/[,，円¥\s]/g, '');
  return /^-?\d+$/.test(s) ? parseInt(s, 10) : NaN;
}
function csvCell(v){
  if (typeof v === 'number') return String(v);
  v = String(v == null ? '' : v);
  if (/^[=+\-@\t\r]/.test(v)) v = "'" + v;             // keep spreadsheets from running a typed "=..." as a formula
  return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
}
function tripCsv(trip, catName){
  var nm = function(id){ var m = trip.members.filter(function(x){ return x.id === id; })[0]; return m ? m.name : '(削除済み)'; };
  var rows = [['日付', '内容', 'カテゴリ', '金額', '払った人', '割り勘の対象']];
  trip.expenses.slice().sort(function(a, b){ return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; }).forEach(function(e){
    rows.push([e.date, e.title, catName(e.cat), e.amount, nm(e.payer), e.split.map(nm).join('・')]);
  });
  rows.push([], ['精算', '払う人', '受け取る人', '金額']);
  settle(calcBalances(trip).net).forEach(function(p){ rows.push(['', nm(p.from), nm(p.to), p.amount]); });
  return rows.map(function(r){ return r.map(csvCell).join(','); }).join('\r\n');
}
/* The demo trip older versions put on first launch. True only while it is exactly as it was installed. */
function isUntouchedSample(t){
  if (!t || !t.sample || t.members.length !== 3 || Object.keys(t.paid || {}).length) return false;
  var sig = t.expenses.map(function(e){ return e.title + ':' + e.amount + ':' + e.cat + ':' + e.split.length; }).join('|');
  var sav = Object.keys(t.savings || {}).map(function(k){ return t.savings[k]; }).sort().join(',');
  return sig === '新幹線:9600:transport:3|旅館 1泊:30000:stay:3|夕食:8700:food:3|ロープウェイ:2400:sight:2|朝食ビュッフェ:4300:food:3' && sav === '15000,20000' && t.budget === 80000;
}
/* Rebuild a trip from backup data field by field, so a restored trip can only contain what the app itself writes. null if unusable. */
function sanitizeTrip(raw, newId){
  var S = function(v, max){ return typeof v === 'string' ? v.slice(0, max) : ''; };
  var D = function(v){ return typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v) ? v : null; };
  var ID = function(v){ return typeof v === 'string' && /^[\w.-]{1,64}$/.test(v) ? v : null; };
  var INT = function(v, lo, hi){ return Number.isInteger(v) && v >= lo && v <= hi; };
  if (!raw || typeof raw !== 'object') return null;
  var name = S(raw.name, 100).trim(), start = D(raw.start), end = D(raw.end);
  if (!name || !start || !end || end < start || !INT(raw.budget, 1, 1e9)) return null;
  var members = (Array.isArray(raw.members) ? raw.members : []).slice(0, 12).map(function(m, i){
    var id = m && ID(m.id), nm = m && S(m.name, 50).trim(); return id && nm ? { id: id, name: nm, pos: INT(m.pos, 0, 1e6) ? m.pos : i } : null; }).filter(Boolean);
  if (!members.length) return null;
  var ids = {}; members.forEach(function(m){ ids[m.id] = 1; });
  var CATK = ['transport', 'stay', 'food', 'sight', 'gift', 'other'];
  var expenses = (Array.isArray(raw.expenses) ? raw.expenses : []).slice(0, 2000).map(function(e){
    if (!e || !ID(e.id) || !INT(e.amount, 1, 1e9) || !ids[e.payer] || CATK.indexOf(e.cat) < 0 || !D(e.date)) return null;
    var split = (Array.isArray(e.split) ? e.split : []).filter(function(x){ return ids[x]; }).slice(0, 12);
    return split.length ? { id: e.id, title: S(e.title, 100), amount: e.amount, payer: e.payer, cat: e.cat, date: e.date, split: split } : null; }).filter(Boolean);
  var paid = {}, savings = {};
  if (raw.paid && typeof raw.paid === 'object') Object.keys(raw.paid).slice(0, 500).forEach(function(k){ if (raw.paid[k] === true && k.length <= 200) paid[k] = true; });
  if (raw.savings && typeof raw.savings === 'object') members.forEach(function(m){ if (INT(raw.savings[m.id], 0, 1e9)) savings[m.id] = raw.savings[m.id]; });
  return { id: newId || ID(raw.id), name: name, start: start, end: end, budget: raw.budget, members: members, expenses: expenses, paid: paid, savings: savings };
}
/* ===== LOGIC_END ===== */

/* push local changes (diff against what the server last had), then pull if somebody else changed it. Resolves 'ok' | 'offline' | 'gone'. */
async function shareSync(t){
  const sh = t.share; if (!sh) return 'ok';
  if (shareBusy[t.id]){ shareAgain[t.id] = true; return 'busy'; }
  shareBusy[t.id] = true;
  let result = 'ok';
  try {
    const rows = Sync.flatten([t]), ops = Sync.diff(sh.snap, rows);
    if (ops.length){ const r = await Share.ops(sh.token, ops); sh.snap = rows; sh.rev = r.rev; persist(); }
    const g = await Share.get(sh.token, sh.rev);
    if (!g.unchanged){
      if (ui.sheet) shareSync.later = true;                                  // do not swap data under an open form
      else if (!Sync.diff(sh.snap, Sync.flatten([t])).length) { applyRemote(t, Sync.assemble([g.trip])[0], g.rev); render(); }
    }
    if (sh.dirty){ sh.dirty = false; render(); }

    if (e && e.status === 404){ result = 'gone'; unshare(t); flash('共有が終了しました。この端末には残っています。'); render(); }
    else { result = 'offline'; if (!sh.dirty){ sh.dirty = true; render(); } }
  } finally {
    shareBusy[t.id] = false;
    if (shareAgain[t.id]){ shareAgain[t.id] = false; shareSoon(); }

}

/* ---- LINE login + backup (worker/account.js). Logging in is optional; sharing by link never needs it. ---- */
const lineAcct = { login: false, user: null, waiting: false, count: null, last: null, push: null };
const LINE_ATTEMPT = 'tabiwari.lineattempt', BK_SIGS = 'tabiwari.bksigs';

function bkItem(t){
  if (t.share) return { kind: 'shared', token: t.share.token, me: t.share.me, name: t.name, start: t.start, end: t.end };
  const copy = JSON.parse(JSON.stringify(t)); delete copy.share; return { kind: 'local', trip: copy };

function bkSoon(){ clearTimeout(bkSoon.t); bkSoon.t = setTimeout(() => bkRun(), 4000); }
async function bkRun(){
  if (!lineAcct.user || bkRun.busy) return; bkRun.busy = true;
  try {
    const sigs = readSigs(), todo = [];
    state.trips.forEach(t => { const item = bkItem(t), sg = sigOf(JSON.stringify(item)); if (sigs[t.id] !== sg) todo.push({ id: t.id, item: item, sg: sg }); });
    for (let i = 0; i < todo.length; i += 20){

      part.forEach(x => { sigs[x.id] = x.sg; }); lsSet(BK_SIGS, JSON.stringify(sigs)); lineAcct.count = r.count;
    }
    if (todo.length) lineAcct.last = Date.now();

    if (e && e.status === 401){ lineAcct.user = null; flash(Line.errText(e)); render(); }
    else if (e && e.status === 413) flash(Line.errText(e));
  } finally { bkRun.busy = false; }

        } catch(e){ if (e.status === 410){ lsSet(LINE_ATTEMPT, null); flash('ログインできませんでした。もう一度お試しください。'); break; } }

function viewTrip(){
  const t = trip();
  if (!t){ ui.view = 'home'; return viewHome(); }
  const st = status(t), sp = total(t), left = t.budget - sp, today = todayStr();
  const pct = Math.min(100, Math.round(sp / t.budget * 100)), over = left < 0;
  let a = ['', 0], b = ['', 0], bWarn = false;
  if (st[0] === '旅行中'){
    const dl = dayDiff(today, t.end) + 1, per = Math.max(0, Math.floor(left / dl));
    const ts = t.expenses.filter(e => e.date === today).reduce((s, e) => s + e.amount, 0);
    a = ['今日からの1日目安', per]; b = ['今日使った額', ts]; bWarn = ts > per;
  } else if (st[0] === '準備中'){
    a = ['1日の目安', Math.floor(t.budget / (dayDiff(t.start, t.end) + 1))]; b = ['1人あたりの予算', Math.floor(t.budget / t.members.length)];
  } else {
    a = ['使った合計', sp]; b = ['1人あたり', Math.round(sp / t.members.length)];
  }
  let h = '<div class="top"><button class="iconbtn" data-a="home" aria-label="旅行の一覧に戻る">' + icon('back') + '</button><h1>' + esc(t.name) + '</h1>' + pill(st) + '</div>' +
    '<div class="sub">' + fmtDate(t.start) + ' - ' + fmtDate(t.end) + (t.share ? '・共有中' : '') + (t.share && t.share.dirty ? '・同期待ち' : '') + '</div>';
  h += '<i class="sp"></i><div class="ticket"><div class="t-top"><div class="t-label">' + (over ? '予算オーバー' : '予算の残り') + '</div>' +
    '<div class="t-amount ' + (over ? 'neg' : '') + '">' + yen(Math.abs(left)) + '</div>' +
    '<div class="t-bar ' + (over ? 'over' : '') + '"><i style="width:' + pct + '%"></i></div>' +
    '<div class="t-label" style="margin-top:8px">' + yen(sp) + ' 使用 / 予算 ' + yen(t.budget) + '</div></div>' +
    '<div class="t-perf"></div><div class="t-bot"><div><div class="t-label">' + a[0] + '</div><b>' + yen(a[1]) + '</b></div>' +
    '<div><div class="t-label">' + b[0] + '</div><b class="' + (bWarn ? 'warn' : '') + '">' + yen(b[1]) + '</b></div></div></div>';
  if (ui.tab === 'exp') h += '<i class="sp"></i>' + usageBar(t);
  h += '<i class="sp"></i><div class="scroll">' + (ui.tab === 'exp' ? tabExp(t) : ui.tab === 'settle' ? tabSettle(t) : tabSave(t)) + '</div>';
  const tb = (k, ic, lb) => '<button class="tab ' + (ui.tab === k ? 'on' : '') + '" data-a="tab" data-t="' + k + '" aria-label="' + lb + '">' + icon(ic) + lb + '</button>';
  return h + '<nav class="nav"><div class="nav-in">' + tb('exp', 'list', '記録') + tb('settle', 'swap', '精算') +
    '<button class="plus" data-a="add-exp" aria-label="支出を追加">' + icon('plus', 28) + '</button>' + tb('save', 'coin', '積立') +
    '<button class="tab" data-a="settings" aria-label="設定">' + icon('sliders') + '設定</button></div></nav>';
}

function usageBar(t){
  if (!t.expenses.length) return '';
  const sp = total(t), by = {};
  t.expenses.forEach(e => { by[e.cat] = (by[e.cat] || 0) + e.amount; });
  const cs = CATS.filter(c => by[c[0]]).sort((x, y) => by[y[0]] - by[x[0]]);
  return '<div class="usage"><div class="seg">' + cs.map(c => '<i style="--h:' + c[3] + ';width:' + (by[c[0]] / sp * 100) + '%"></i>').join('') + '</div><div class="legend2">' +
    cs.map(c => '<span><span class="dot" style="--h:' + c[3] + '"></span>' + c[2] + ' <b>' + by[c[0]].toLocaleString('ja-JP') + '</b></span>').join('') + '</div></div>';
}
function tabExp(t){
  if (!t.expenses.length) return '<div class="empty"><b>最初の支出を記録しましょう</b>中央の ＋ ボタンから、金額と払った人を入力します。</div>';
  let h = '';
  const days = {};
  t.expenses.forEach(e => { (days[e.date] = days[e.date] || []).push(e); });
  Object.keys(days).sort().reverse().forEach(d => {
    const sub = days[d].reduce((s, e) => s + e.amount, 0);
    h += '<div class="sec"><h2>' + fmtDay(d) + '<span>' + yen(sub) + '</span></h2><div class="list">';
    days[d].slice().reverse().forEach(e => {
      const c = CAT[e.cat] || CAT.other;
      h += '<button class="item" data-a="edit-exp" data-id="' + e.id + '">' + tag(c) +
        '<div class="grow"><div class="t">' + esc(e.title || c[2]) + '</div><div class="sub">' + esc(nameOf(t, e.payer)) + 'が払った・' +
        (e.split.length === t.members.length ? '全員で割り勘' : e.split.length === 1 ? esc(nameOf(t, e.split[0])) + 'の分' : e.split.length + '人で割り勘') + '</div></div>' +
        '<div class="amt">' + yen(e.amount) + '</div></button>';
    });
    h += '</div></div>';
  });
  return h;
}

function tabSettle(t){
  if (!t.expenses.length) return '<div class="empty"><b>精算はまだありません</b>支出を記録すると、誰が誰にいくら払えばいいかが出ます。</div>';
  const bal = calcBalances(t), pays = settle(bal.net);
  const key = p => p.from + '-' + p.to + '-' + p.amount;
  const left = pays.filter(p => !t.paid[key(p)]).length;
  let h = '<div class="sec"><h2>送金<span>' + (!pays.length ? '' : left ? 'あと' + left + '件' : 'すべて完了') + '</span></h2>';
  if (!pays.length) h += '<div class="panel"><b>精算は必要ありません。</b><div class="sub">全員の支払いがちょうど同じです。</div></div>';
  else {
    h += '<div class="list">' + pays.map(p => '<div class="xfer ' + (t.paid[key(p)] ? 'done' : '') + '"><span class="avs">' + av(t, p.from) + av(t, p.to) + '</span>' +
      '<div class="names">' + esc(nameOf(t, p.from)) + ' → ' + esc(nameOf(t, p.to)) + '</div><div class="amt">' + yen(p.amount) + '</div>' +
      '<button class="chk ' + (t.paid[key(p)] ? 'on' : '') + '" data-a="toggle-paid" data-k="' + key(p) + '" aria-label="支払い済みにする" aria-pressed="' + (t.paid[key(p)] ? 'true' : 'false') + '">' + icon('check', 20) + '</button></div>').join('') + '</div>' +
      '<div style="margin-top:10px"><button class="btn line" data-a="copy-settle" style="padding:10px 16px">LINEに貼る文面をコピー</button></div>';
    if (ui.copyText) h += '<div style="margin-top:10px"><div class="sub" style="margin-bottom:6px">コピーできないときは、ここを長押しして選択してください。</div><textarea class="copybox" readonly aria-label="精算の文面">' + esc(ui.copyText) + '</textarea></div>';
  }
  h += '</div><div class="sec"><h2>ひとりずつの内訳</h2><div class="list">' + t.members.map(m => {
    const n = bal.net[m.id];
    return '<div class="item slim">' + av(t, m.id) + '<div class="grow"><div class="t">' + esc(m.name) + '</div><div class="sub sm">立て替え ' + yen(bal.paid[m.id]) + '・負担 ' + yen(bal.owed[m.id]) + '</div></div>' +
      '<div class="amt plus-or-minus ' + (n > 0 ? 'pos' : n < 0 ? 'neg' : '') + '">' + (n > 0 ? '+' : n < 0 ? '−' : '') + Math.abs(n).toLocaleString('ja-JP') + '円</div></div>';
  }).join('') + '</div></div>';
  return h;
}

function tabSave(t){
  const target = Math.ceil(t.budget / t.members.length);

  let h = '<div class="sec"><h2>旅行までの積立<span>1人 ' + yen(target) + ' が目標</span></h2><div class="panel"><div class="row between"><b>みんなの合計</b><span class="num">' + yen(sum) + '</span></div>' +
    '<div class="bar"><i style="width:' + pct + '%"></i></div><div class="sub" style="margin-top:6px">予算 ' + yen(t.budget) + ' の ' + pct + '%</div></div></div>' +
    '<div class="sec"><div class="list">';

}

  if (s.type === 'join-share'){
    const jt = s.trip; ttl = '共有された旅行';
    body = '<div class="panel" style="margin-top:12px"><div class="num">' + esc(jt.name) + '</div><div class="sub">' + fmtDate(jt.start) + ' - ' + fmtDate(jt.end) + '・メンバー ' + jt.members.length + '人・支出 ' + jt.expenses.length + '件</div></div>' +
      '<label class="lab" for="j-name">あなたの名前</label><input class="field" id="j-name" type="text" maxlength="50" value="' + esc(s.name) + '" placeholder="例：みく">' +
      (jt.members.length ? '<span class="lab">すでに参加している人（別の端末から入り直すとき）</span><div class="chips">' + jt.members.map(m => '<button class="chip ' + (s.pick === m.id ? 'on' : '') + '" data-a="join-pick" data-v="' + m.id + '" aria-pressed="' + (s.pick === m.id) + '">' + av(jt, m.id) + esc(m.name) + '</button>').join('') + '</div><div class="sub sm" style="margin-top:6px">自分が、すでにこの旅行に参加しているときだけ、選びます。ほかの人の名前は、選ばないでください。</div>' : '') +
      '<div class="sub sm" style="margin-top:8px">参加すると、この旅行の支出と精算を、見て、記録できます。</div>';
    foot = err + '<button class="btn" data-a="join-share-go"' + (s.busy ? ' disabled' : '') + '>参加する</button><button class="link" data-a="close-sheet">やめる</button>';
  }
  if (s.type === 'join-paste'){
    ttl = '共有リンクで参加';
    body = '<div class="sub" style="margin-top:12px">友だちから届いたリンク（またはメッセージ）を、そのまま貼り付けてください。</div>' +
      '<label class="lab" for="p-link">共有リンク</label><textarea class="field" id="p-link" rows="3" placeholder="https://…/#t=…" style="resize:none">' + esc(s.text || '') + '</textarea>' +
      '<div class="sub sm" style="margin-top:8px">LINEのリンクを開くと、ホーム画面のアプリとは別の場所（Safari）で開いてしまいます。アプリの中で参加したいときは、リンクをコピーして、ここに貼り付けます。</div>';
    foot = err + '<button class="btn" data-a="join-paste-go"' + (s.busy ? ' disabled' : '') + '>確認する</button>';
  }
  return '<div class="sheet-bg" data-a="bg"><div class="sheet" role="dialog" aria-modal="true"><div class="row between"><h2>' + ttl + '</h2><button class="iconbtn" data-a="close-sheet" aria-label="閉じる">' + icon('close') + '</button></div>' +
    '<div class="sheet-body">' + body + '</div><div class="sheet-foot">' + foot + '</div></div></div>';
}
function splitHint(d){
  const a = parseYen(d.amount);
  if (!(a > 0)) return '金額を入れると、1人あたりの金額が出ます。';
  if (!d.split.length) return '割り勘の対象を選んでください。';
  const sh = splitShares(a, d.split, '').map(x => x[1]), lo = Math.min.apply(null, sh), hi = Math.max.apply(null, sh);
  return d.split.length === 1 ? '1人の分として記録します。' : '1人あたり ' + yen(lo) + (lo !== hi ? '〜' + yen(hi) : '') + '（' + d.split.length + '人で割り勘）';
}

/* ---- actions ---- */
function nextPos(t){ return t.members.reduce((mx, m, i) => Math.max(mx, m.pos != null ? m.pos : i), -1) + 1; }
function newDraft(){ const d = todayStr(); return { name: '', start: d, end: addDays(d, 1), budget: '', me: state.me || '自分', err: '' }; }
function readSheet(){
  const s = ui.sheet; if (!s) return;
  const g = id => document.getElementById(id);
  if (s.type === 'exp'){
    if (g('f-amount')) s.data.amount = g('f-amount').value;
    if (g('f-title')) s.data.title = g('f-title').value;
    if (g('f-date')) s.data.date = g('f-date').value;
  } else if (s.type === 'join-share'){
    if (g('j-name')) s.name = g('j-name').value;
  } else if (s.type === 'settings'){
    ['name', 'start', 'end', 'budget'].forEach(k => { const el = g('s-' + k); if (el) s.data[k] = el.value; });
  }
}

document.addEventListener('input', e => {
  if (e.target.id === 'j-name' && ui.sheet && ui.sheet.type === 'join-share'){ ui.sheet.pick = null; document.querySelectorAll('.sheet .chip.on').forEach(c => c.classList.remove('on')); }
  const k = e.target.getAttribute && e.target.getAttribute('data-draft');
  if (k && ui.draft) ui.draft[k] = e.target.value;
  if (e.target.id === 'f-amount' && ui.sheet){ ui.sheet.data.amount = e.target.value; document.getElementById('f-hint').textContent = splitHint(ui.sheet.data); }
});

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el) return;
  const a = el.getAttribute('data-a'), id = el.getAttribute('data-id'), t = trip(), s = ui.sheet;
  if (a === 'bg'){ if (e.target !== el) return; ui.sheet = null; render(); return; }

  if (a === 'home'){ ui.view = 'home'; ui.tripId = null; ui.copyText = null; }
  else if (a === 'open'){ ui.resetScroll = true; ui.view = 'trip'; ui.tripId = id; ui.tab = 'exp'; ui.copyText = null; }
  else if (a === 'install'){ if (deferredInstall){ deferredInstall.prompt(); deferredInstall = null; } }
  else if (a === 'dismiss-install'){ try { localStorage.setItem('tabiwari.noinstall', '1'); } catch(err){} }
  else if (a === 'new'){ ui.view = 'new'; ui.draft = newDraft(); }
  else if (a === 'line-login'){ lineLogin(); return; }
  else if (a === 'line-cancel'){ lsSet(LINE_ATTEMPT, null); lineAcct.waiting = false; }
  else if (a === 'line-account'){ ui.sheet = { type: 'line-account', err: '', confirm: false, ntf: null }; ntfRefreshSheet(); Line.backupGet().then(r => { lineAcct.count = r.items.length; render(); }, () => {}); }
  else if (a === 'ntf-test'){
    s.testing = true; s.testMsg = '送っています…'; s.err = '';
    Line.pushTest().then(r => { s.testing = false; s.testMsg = r.sent ? '送りました。数秒以内に届かないときは、端末の通知設定を確認してください。' : '配信サービスが受け付けませんでした。もう一度お試しください。'; render(); },
      er => { s.testing = false; s.testMsg = ''; s.err = Line.errText(er); render(); });
  }
  else if (a === 'ntf-toggle'){
    const on = s.ntf === 'on';
    (on ? ntfOff() : ntfOn()).then(v => { if (ui.sheet && ui.sheet.type === 'line-account'){ ui.sheet.ntf = v; ui.sheet.err = ''; render(); } },
      er => { if (ui.sheet && ui.sheet.type === 'line-account'){ ui.sheet.err = er && er.status ? Line.errText(er) : '通知を設定できませんでした。もう一度お試しください。'; render(); ntfRefreshSheet(); } });
    return;
  }
  else if (a === 'bk-now'){ readSheet(); lsSet(BK_SIGS, null); bkRun().then(() => { flash('バックアップしました'); render(); }); return; }
  else if (a === 'bk-restore'){ ui.sheet = { type: 'line-restore', items: [], pick: [], err: '', busy: false, loading: true };
    Line.backupGet().then(r => openRestore(r.items), er => { if (ui.sheet) { ui.sheet.loading = false; ui.sheet.err = Line.errText(er); render(); } }); }
  else if (a === 'bk-pick'){ const i = s.pick.indexOf(id); if (i >= 0) s.pick.splice(i, 1); else s.pick.push(id); }
  else if (a === 'bk-restore-go'){
    const chosen = s.items.filter(x => s.pick.indexOf(x.id) >= 0);
    if (!chosen.length) s.err = '戻す旅行を、1つ以上選んでください。';
    else { s.busy = true; s.err = ''; restoreTrips(chosen).then(r => { ui.sheet = null; if (r.ok) save(); render(); flash(r.ok + '件を戻しました' + (r.skipped ? '（' + r.skipped + '件は、戻せませんでした）' : '')); }); }
  }
  else if (a === 'bk-del-go'){ if (!s.pick.length) s.err = '削除する旅行を、1つ以上選んでください。'; else { s.err = ''; s.delAsk = true; } }
  else if (a === 'bk-del-no'){ s.delAsk = false; }
  else if (a === 'bk-del-yes'){
    const ids = s.pick.slice(); if (!ids.length) s.err = '削除する旅行を、1つ以上選んでください。';
    else Line.backupPut([], ids.slice(0, 20)).then(r => { lineAcct.count = r.count; const sigs = readSigs(); ids.forEach(x => delete sigs[x]); lsSet(BK_SIGS, JSON.stringify(sigs));
      return Line.backupGet(); }).then(r => { openRestore(r.items); flash('バックアップから削除しました'); }, er => { if (ui.sheet) { ui.sheet.err = Line.errText(er); render(); } });
  }
  else if (a === 'line-logout'){ ui.sheet = null; ntfOff().catch(() => {}).then(() => Line.logout()).catch(() => {}).then(() => { lineAcct.user = null; lineAcct.count = null; lsSet(BK_SIGS, null); render(); flash('ログアウトしました'); }); return; }
  else if (a === 'line-del-ask'){ s.confirm = true; }
  else if (a === 'line-del-go'){
    Line.deleteAccount().then(() => { ntfOff().catch(() => {}); ui.sheet = null; lineAcct.user = null; lineAcct.count = null; lsSet(BK_SIGS, null); render(); flash('アカウントを削除しました。この端末の旅行は、残っています'); },
      er => { if (ui.sheet) { ui.sheet.err = Line.errText(er); render(); } });
    return;
  }
  else if (a === 'join-paste'){ ui.sheet = { type: 'join-paste', err: '', text: '', busy: false }; }
  else if (a === 'join-paste-go'){
    const text = document.getElementById('p-link').value, tok = Share.parseToken(text); s.text = text;
    if (!tok) s.err = 'リンクの形式を確認してください。「#t=」から始まる部分まで、そのまま貼り付けます。';
    else { s.err = ''; s.busy = true; beginJoin(tok).then(sh => { if (sh) ui.sheet = sh; else if (ui.sheet && ui.sheet.type === 'join-paste') ui.sheet = null; render(); },
      er => { if (ui.sheet && ui.sheet.type === 'join-paste'){ ui.sheet.busy = false; ui.sheet.err = Share.errText(er); render(); } }); }
  }
  else if (a === 'join-pick'){ readSheet(); s.pick = el.getAttribute('data-v'); s.name = ''; }
  else if (a === 'join-share-go'){
    readSheet(); const jt = s.trip, nm = (s.name || '').trim();
    if (!s.pick && !nm) s.err = '名前を入力するか、すでに参加している自分を選んでください。';
    else if (!s.pick && jt.members.some(m => m.name === nm)) s.err = '同じ名前のメンバーがいます。リストから選んでください。';
    else if (!s.pick && jt.members.length >= 12) s.err = 'メンバーは12人までです。リストから選んでください。';
    else {
      let me = s.pick;
      jt.share = { token: s.token, me: null, rev: s.rev, snap: Sync.flatten([jt]), dirty: false };   // what the server has right now
      if (!me){ me = uid(); jt.members.push({ id: me, name: nm, pos: nextPos(jt) }); }
      jt.share.me = me; state.trips.push(jt); ui.sheet = null; ui.view = 'trip'; ui.tripId = jt.id; ui.tab = 'exp'; ui.resetScroll = true;
      save(); render(); flash('参加しました'); return;
    }
  }
  else if (a === 'share-start'){ readSheet(); s.sharing = true; startShare(t).then(() => { if (ui.sheet) ui.sheet.sharing = false; render(); }); }
  else if (a === 'share-copy'){
    const url = Share.linkFor(t.share.token, location), text = '「' + t.name + '」の割り勘に参加してね。';
    if (navigator.share){ navigator.share({ title: 'たびわり', text: text, url: url }).catch(() => {}); }
    else { try { navigator.clipboard.writeText(text + '\n' + url).then(() => flash('コピーしました'), () => {}); } catch(err){} const el2 = document.getElementById('s-sharelink'); if (el2) el2.select(); }
    return;
  }
  else if (a === 'share-stop'){ readSheet(); s.confirm = 'stop'; }
  else if (a === 'share-erase'){ readSheet(); s.confirm = 'erase'; }
  else if (a === 'share-stop-go'){ unshare(t); s.confirm = null; flash('この端末の共有をやめました'); }
  else if (a === 'share-erase-go'){
    const tk = t.share.token; s.confirm = null;
    Share.remove(tk).then(() => { const x = state.trips.filter(q => q.share && q.share.token === tk)[0]; if (x) unshare(x); render(); flash('共有を終了しました'); }, er => flash(Share.errText(er)));
    return;
  }
  else if (a === 'export-csv'){
    readSheet();
    downloadCsv(t); flash('CSVを書き出しました'); return;
  }
  else if (a === 'preset'){ ui.draft.budget = el.getAttribute('data-v'); }
  else if (a === 'save-trip'){
    const d = ui.draft, b = parseYen(d.budget);
    if (!d.name.trim()) d.err = '旅行の名前を入力してください。';
    else if (d.end < d.start) d.err = '帰着日は、出発日と同じか、それ以降にしてください。';
    else if (!(b > 0)) d.err = '予算を、1以上の数字で入力してください。';
    else {
      const me = d.me.trim() || '自分'; state.me = me;
      const nt = { id: uid(), name: d.name.trim(), start: d.start, end: d.end, budget: b, paid: {}, savings: {},
        members: [{ id: uid(), name: me, pos: 0 }], expenses: [] };
      state.trips.push(nt); save(); ui.view = 'trip'; ui.tripId = nt.id; ui.tab = 'exp'; ui.draft = null;
    }
  }
  else if (a === 'tab'){ ui.tab = el.getAttribute('data-t'); ui.copyText = null; ui.resetScroll = true; }

  else if (a === 'add-exp'){
    const today = todayStr();
    ui.sheet = { type: 'exp', err: '', editId: null, data: { amount: '', title: '', cat: 'food', payer: meId(t),
      split: t.members.map(m => m.id), date: (today < t.start || today > t.end) ? t.start : today } };
  }
  else if (a === 'edit-exp'){
    const x = t.expenses.filter(q => q.id === id)[0];
    ui.sheet = { type: 'exp', err: '', editId: id, data: { amount: String(x.amount), title: x.title, cat: x.cat, payer: x.payer, split: x.split.slice(), date: x.date } };
  }
  else if (a === 'pick-cat'){ readSheet(); s.data.cat = el.getAttribute('data-v'); }
  else if (a === 'pick-payer'){ readSheet(); s.data.payer = el.getAttribute('data-v'); }
  else if (a === 'split-all'){ readSheet(); s.data.split = t.members.map(m => m.id); }
  else if (a === 'toggle-split'){
    readSheet(); const v = el.getAttribute('data-v'), ix = s.data.split.indexOf(v);
    if (ix >= 0) s.data.split.splice(ix, 1); else s.data.split.push(v);
  }
  else if (a === 'save-exp'){
    readSheet(); const dd = s.data, amt = parseYen(dd.amount);
    if (!(amt > 0)) s.err = '金額を、1以上の数字で入力してください。';
    else if (!dd.split.length) s.err = '誰の分かを、1人以上選んでください。';
    else {
      const order = t.members.map(m => m.id), rec = { title: dd.title.trim(), amount: amt, payer: dd.payer, cat: dd.cat, date: dd.date || todayStr(),
        split: dd.split.slice().sort((x, y) => order.indexOf(x) - order.indexOf(y)) };
      if (s.editId){ Object.assign(t.expenses.filter(q => q.id === s.editId)[0], rec); }
      else t.expenses.push(Object.assign({ id: uid() }, rec));
      const wasEdit = !!s.editId; save(); ui.sheet = null; ui.copyText = null; render(); flash(wasEdit ? '保存しました' : '記録しました'); return;
    }
  }
  else if (a === 'ask-del'){ readSheet(); s.confirmDel = true; }
  else if (a === 'del-exp'){ t.expenses = t.expenses.filter(q => q.id !== s.editId); save(); ui.sheet = null; render(); flash('削除しました'); return; }

  else if (a === 'toggle-paid'){ const k = el.getAttribute('data-k'); if (t.paid[k]) delete t.paid[k]; else t.paid[k] = true; save(); }
  else if (a === 'copy-settle'){
    const text = '【' + t.name + ' 精算】\n' + settle(calcBalances(t).net).map(p => nameOf(t, p.from) + ' → ' + nameOf(t, p.to) + '：' + yen(p.amount)).join('\n');
    ui.copyText = text;
    try { navigator.clipboard.writeText(text).then(() => flash('コピーしました'), () => {}); } catch(err){}
  }
  else if (a === 'add-save'){ ui.sheet = { type: 'save', id: id, err: '' }; }
  else if (a === 'quick-save'){ document.getElementById('f-save').value = el.getAttribute('data-v'); return; }
  else if (a === 'save-saving'){
    const n = parseYen(document.getElementById('f-save').value);
    if (!(n !== 0 && !isNaN(n))) s.err = '金額を数字で入力してください（例：5000）。';
    else { t.savings[s.id] = Math.max(0, (t.savings[s.id] || 0) + n); save(); ui.sheet = null; render(); flash('記録しました'); return; }
  }

  else if (a === 'settings'){ ui.sheet = { type: 'settings', err: '', confirmDel: false, data: { name: t.name, start: t.start, end: t.end, budget: String(t.budget) } }; }
  else if (a === 'rm-tmember'){ readSheet(); t.members = t.members.filter(m => m.id !== id); save(); }
  else if (a === 'save-settings'){
    readSheet(); const d = s.data, b = parseYen(d.budget);
    if (!d.name.trim()) s.err = '旅行の名前を入力してください。';
    else if (d.end < d.start) s.err = '帰着日は、出発日と同じか、それ以降にしてください。';
    else if (!(b > 0)) s.err = '予算を、1以上の数字で入力してください。';
    else {
      t.name = d.name.trim(); t.start = d.start; t.end = d.end; t.budget = b; save(); ui.sheet = null; render(); flash('保存しました'); return;
    }
  }
  else if (a === 'ask-del-trip'){ readSheet(); s.confirmDel = true; }
  else if (a === 'del-trip'){ state.trips = state.trips.filter(x => x.id !== t.id); save(); ui.sheet = null; ui.view = 'home'; ui.tripId = null; }
  else if (a === 'close-sheet'){ ui.sheet = null; }
  render();
});

render();
bootShare();
</script>
</body>
</html>
