<style>
/* Layout idea: one column phone app. A navy boarding-pass card shows what is left; amber is the single action colour; bottom tab bar. */
:root{
  --ts:1;
  --ease:cubic-bezier(.22,1,.36,1);   /* one calm curve for every move: quick start, soft stop */
  --paper:#eef2f7; --card:#ffffff; --ink:#0e2238; --sub:#5b6b80; --line:#dde4ee; --soft:#e6ecf5;
  --navy:#0f2742; --sun:#ffc83d; --sun-ink:#2a1d00; --good:#17895c; --bad:#c2332d; --focus:#2f6fed;
  --cream:#fffdf5; --dash:rgba(14,34,56,.26); --mono:ui-monospace,"SF Mono",Menlo,"DejaVu Sans Mono",monospace;   /* paper-ticket look (v148): cream paper, dashed perforations, tabular numbers */
  --tbs:85%; --tbl:92%; --tfs:55%; --tfl:30%;
  --font:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0a1626; --card:#12243a; --ink:#e9f0fa; --sub:#93a3b8; --line:#243750; --soft:#1a2f4a;
    --navy:#17375e; --good:#4cc795; --bad:#ff7a73; --focus:#7aa2ff; --cream:#15293f; --dash:rgba(233,240,250,.3);
    --tbs:38%; --tbl:24%; --tfs:75%; --tfl:82%; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0a1626; --card:#12243a; --ink:#e9f0fa; --sub:#93a3b8; --line:#243750; --soft:#1a2f4a;
  --navy:#17375e; --good:#4cc795; --bad:#ff7a73; --focus:#7aa2ff; --cream:#15293f; --dash:rgba(233,240,250,.3);
  --tbs:38%; --tbl:24%; --tfs:75%; --tfl:82%; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
/* shown while the page loads (plain HTML + CSS, no waiting); removed on the first render */
#splash{position:fixed;inset:0;z-index:99;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .2s;opacity:0;animation:splash-in .15s .3s forwards}   /* invisible for the first 0.3s: a quick start never shows it */
@keyframes splash-in{to{opacity:1}}
#splash img{border-radius:22px;box-shadow:0 6px 18px rgba(15,39,66,.18)}#splash b{font-size:calc(22px*var(--ts));font-weight:700;letter-spacing:.04em;color:var(--ink)}
#splash.out{opacity:0!important;animation:none;pointer-events:none}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-weight:400;line-height:1.55;font-variant-numeric:tabular-nums}
b,strong{font-weight:500}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
#app{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 8px) 16px calc(env(safe-area-inset-bottom) * .5 + 84px)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.sub{color:var(--sub);font-size:calc(13px*var(--ts))}
.sm{font-size:calc(12px*var(--ts))}
.num{font-weight:700;font-size:calc(18px*var(--ts))}
.right{text-align:right}

/* header */
.brand{font-size:calc(30px*var(--ts));font-weight:700;letter-spacing:.02em;margin:6px 0 2px}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:10px}.brandrow .iconbtn{margin-top:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#app.fit{height:100%;overflow:hidden;display:flex;flex-direction:column;padding-bottom:0}
#app.fit>*{flex:none}
#app.fit>.sp{display:block;flex:10 1 0;min-height:6px;max-height:24px}
#app{touch-action:pan-y;overflow-x:clip}
html,body{overscroll-behavior-x:none}
#app.fit>.scroll{touch-action:pan-y;flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;margin:0 -16px;padding:0 16px 8px}
#app.nonav{padding-bottom:calc(env(safe-area-inset-bottom) * .5 + 10px)}
.cta{padding-top:10px}
.scroll>.lab:first-child{margin-top:6px}
.scroll>.lab,.scroll .two .lab{margin-top:14px}
.scroll>.sec:first-child{margin-top:0}
.scroll .sec{margin-top:10px}
.item.slim{padding:6px 12px;gap:10px;line-height:1.4}
.top{display:flex;align-items:center;gap:10px;margin-bottom:0}
.top h1{font-size:calc(18px*var(--ts));font-weight:700;margin:0;flex:1;min-width:0;overflow-wrap:anywhere;text-wrap:balance}
.iconbtn{width:44px;height:44px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.pill{font-size:calc(12px*var(--ts));font-weight:500;padding:3px 10px;border-radius:99px;white-space:nowrap;background:var(--soft);color:var(--sub)}
.pill.now{background:var(--sun);color:var(--sun-ink)}

/* tags and avatars share one hue system */
.tag,.av{--h:215;background:hsl(var(--h) var(--tbs) var(--tbl));color:hsl(var(--h) var(--tfs) var(--tfl));display:grid;place-items:center;font-weight:700;flex:none}
.tag{width:42px;height:42px;border-radius:14px;font-size:calc(17px*var(--ts))}
.melink{border:1.5px solid var(--line);border-radius:14px;background:var(--card);padding:10px 14px!important;margin-top:4px;width:100%;text-align:left;color:var(--ink)}
.av{width:30px;height:30px;border-radius:50%;font-size:calc(14px*var(--ts));position:relative;overflow:hidden}.avimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%}
.avs{display:flex}
.avs .av{border:2px solid var(--card);margin-left:-8px}
.avs .av:first-child{margin-left:0}
.pill.wait{background:none;border:1.5px dashed var(--sub);color:var(--sub);padding:1px 9px}

/* home */
.trip{display:flex;position:relative;width:100%;text-align:left;background:var(--cream);border:0;border-radius:16px;padding:0;margin-top:10px;box-shadow:0 1px 0 var(--dash);--stub:calc(116px*var(--ts))}
.trip-name{font-size:calc(18px*var(--ts));font-weight:700;overflow-wrap:anywhere}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:12px}
.bar>i{display:block;height:100%;background:var(--sun);border-radius:99px}
.trip.now{box-shadow:0 0 0 2px var(--sun)}
.trip .hint{font-weight:700;color:var(--ink)}
.bar.over>i{background:var(--bad)}
.legal a{color:var(--sub)}
.chip .x{width:24px;height:24px;display:grid;place-items:center;color:var(--sub);font-size:calc(18px*var(--ts));line-height:1;margin-left:2px}
.install.col{flex-direction:column;align-items:stretch;gap:8px}
/* LINE Login button, built to LINE's design guidelines: #06C755, white text, official icon (icons/line-login-icon.png, unmodified), 8% black divider, hover +10% / press +30% black */
.lineg{position:relative;display:flex;align-items:stretch;width:100%;height:44px;padding:0;border-radius:6px;overflow:hidden;background:#06c755;color:#fff;font-size:calc(16px*var(--ts));font-weight:700;white-space:nowrap}
.lineg img{display:block;width:44px;height:44px;flex:none;border-right:1px solid rgba(0,0,0,.08);box-sizing:border-box}
.lineg span{flex:1;display:flex;align-items:center;justify-content:center;padding:0 32px}
.lineg::after{content:"";position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:0}   /* layer order from LINE's guideline: base colour, then the black overlay, then the divider and the white text/logo on top */
.lineg:active::after{opacity:.3}   /* pressed only: black 30% (no hover shade) */
.lineg img,.lineg span{position:relative;z-index:1}
.lineg:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.install{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin-top:10px;font-size:calc(13px*var(--ts))}
.install .btn{width:auto;padding:8px 14px;font-size:calc(14px*var(--ts));flex:none}
.install a.btn{text-decoration:none;text-align:center}
.install .btn.sm{padding:7px 12px}
.ic-inline{display:inline-block;vertical-align:-3px}
.install .x{width:32px;height:32px;display:grid;place-items:center;color:var(--sub);flex:none}
.empty{text-align:center;padding:34px 12px;color:var(--sub)}
.exp0{padding:6px 12px 0;white-space:nowrap}.exp0 b{display:block;font-size:calc(16px*var(--ts));margin-bottom:2px}.exp0 span{display:block;font-size:calc(14px*var(--ts))}.exp0 .btn{width:min(100%,280px);margin:16px auto 0;padding:13px 18px;font-size:calc(15px*var(--ts))}
.mem-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}
.mem-row .btn.sm{width:auto;flex:none;padding:7px 14px;font-size:calc(14px*var(--ts));border-radius:12px}
.home1{touch-action:pan-y;display:flex;flex-direction:column;min-height:calc(100vh - 92px - env(safe-area-inset-top) - env(safe-area-inset-bottom) * .5)}
@supports (height:100dvh){.home1{min-height:calc(100dvh - 92px - env(safe-area-inset-top) - env(safe-area-inset-bottom) * .5)}}
.home1-foot{margin-top:auto;padding-top:16px}
.foot1{text-align:center;white-space:nowrap}.foot1 button{color:var(--sub);text-decoration:underline;font:inherit;padding:8px 0}.foot1 a{display:inline-block;padding:8px 0}
.btn.inv{margin-top:8px;padding:10px 14px;font-size:calc(14px*var(--ts));border-radius:14px}
.btn.inv.join{margin-top:14px;color:var(--sub);font-weight:500;border-style:dashed}
.home0{display:flex;flex-direction:column;height:100%;min-height:0;overflow-y:auto;margin:0 -16px;padding:0 16px calc(env(safe-area-inset-bottom) * .5 + 12px)}   /* full width: the scroll bar sits on the screen edge, not over the cards */
#app.fit>.home0{flex:1 1 auto;height:auto}
.home0-cta{margin:0 -16px;padding:10px 16px calc(env(safe-area-inset-bottom) * .5 + 12px);background:linear-gradient(to bottom,transparent,var(--paper) 30%);position:relative;z-index:5}
.brandact{display:flex;align-items:center;gap:8px}.lineg.sm.hd{width:auto;height:34px;font-size:calc(12.5px*var(--ts));border-radius:6px}.lineg.sm.hd img{width:34px;height:34px}.lineg.sm.hd span{padding:0 12px}
.home0>*{flex:none}
/* the first page (no trip yet): a page to read, not one screen. Hero, the three moments with real screens, the settle-up features, notifications, how to start, FAQ. */
.lp-hero{padding:20px 0 6px;overflow-x:clip}
.lp-eye{font-family:var(--mono);font-size:calc(11px*var(--ts));letter-spacing:.14em;color:var(--sub);text-transform:uppercase}
.lp-h{font-size:min(calc(27px*var(--ts)),calc((100vw - 32px) / 13.6 * var(--ts)));line-height:1.4;margin:6px 0 10px;font-weight:700}.lp-br:first-of-type{display:none}   /* the first break is not needed: two lines on a normal phone */
@media (max-height:640px){.lp-lead{display:none}.lp-h{margin-bottom:12px}}
.lp-lead{color:var(--sub);font-size:calc(14px*var(--ts));line-height:1.7;margin:0 0 16px}
.home0-tags{text-align:left;color:var(--sub);font-size:calc(12.5px*var(--ts));margin:12px 0 22px;white-space:nowrap}
/* the sample trip ticket in the hero: cream paper, a perforation with a notch at both ends, a barcode, and a pressed stamp */
.lp-tk{position:relative;background:var(--cream);color:var(--ink);border-radius:14px;margin:6px 0 4px;box-shadow:0 1px 0 var(--dash)}
.lp-tk-top{padding:16px 18px 14px}.lp-tk-hd{display:flex;justify-content:space-between;font-family:var(--mono);font-size:calc(10.5px*var(--ts));letter-spacing:.14em;color:var(--sub);margin-bottom:12px}
.lp-tk-grid{display:grid;grid-template-columns:1fr auto;gap:12px 16px}.lp-tk small{display:block;font-family:var(--mono);font-size:calc(10px*var(--ts));letter-spacing:.12em;color:var(--sub)}.lp-tk b{font-size:calc(17px*var(--ts));font-weight:700;font-variant-numeric:tabular-nums}
.lp-tk-bot{position:relative;border-top:2px dashed var(--dash);padding:14px 18px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.lp-tk-bot:before,.lp-tk-bot:after{content:"";position:absolute;top:-11px;width:11px;height:22px;background:var(--paper)}.lp-tk-bot:before{left:0;border-radius:0 11px 11px 0}.lp-tk-bot:after{right:0;border-radius:11px 0 0 11px}   /* half discs, inside the ticket: nothing sticks out sideways */
.lp-bars{display:block;flex:1;max-width:150px;height:32px;opacity:.85;background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 5px,var(--ink) 5px 6px,transparent 6px 10px,var(--ink) 10px 14px,transparent 14px 17px,var(--ink) 17px 19px,transparent 19px 22px)}
.lp-tk-stamp{position:absolute;right:16px;top:-16px;width:60px;height:60px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:calc(24px*var(--ts));color:#0f2742;border:2.5px solid #0f2742;background:radial-gradient(circle at 35% 30%,#ffe08a,#ffc83d);transform:rotate(10deg);box-shadow:inset 0 0 0 3px rgba(255,255,255,.55)}.lp-tk-stamp:after{content:"";position:absolute;inset:-6px;border-radius:50%;border:1.5px dashed #0f2742;opacity:.5}
.lp-sec{padding:34px 0 4px}.lp-sec h2{font-size:calc(20px*var(--ts));margin:2px 0 6px;font-weight:700}.lp-sub{font-size:calc(13px*var(--ts));color:var(--sub);margin:0 0 14px}
/* the route: a dashed line with a numbered stop for each moment of the trip */
.lp-rail{position:relative;margin-top:16px;padding-left:42px}.lp-rail:before{content:"";position:absolute;left:14px;top:8px;bottom:8px;border-left:2px dashed var(--dash)}
.lp-stage{position:relative;margin-bottom:26px}.lp-stage .n{position:absolute;left:-39px;top:0;width:24px;height:24px;border-radius:50%;background:var(--sun);color:var(--sun-ink);font-weight:700;font-size:12px;display:grid;place-items:center;border:2px solid var(--paper);box-shadow:0 0 0 2px var(--ink)}
.lp-stage small{font-family:var(--mono);font-size:calc(11px*var(--ts));letter-spacing:.12em;color:var(--sub)}.lp-stage h3{margin:2px 0 4px;font-size:calc(18px*var(--ts))}.lp-stage p{margin:0 0 10px;font-size:calc(13px*var(--ts));color:var(--sub);line-height:1.6}
.lp-stage img{display:block;width:100%;height:auto;border-radius:8px;background:var(--paper)}.lp-shot{background:var(--cream);border-radius:12px;padding:8px;box-shadow:0 1px 0 var(--dash)}
/* the details: a receipt, a dotted leader between the name and its note */
.lp-feat{background:var(--cream);border-radius:12px;border-top:3px dashed var(--dash);padding:8px 18px 10px;box-shadow:0 1px 0 var(--dash)}
.lp-feat .ln{display:flex;align-items:baseline;gap:6px;padding:8px 0;font-size:calc(14px*var(--ts))}.lp-feat .ln b{font-weight:600;white-space:nowrap}.lp-feat .ln i{flex:1;min-width:8px;border-bottom:2px dotted var(--dash);transform:translateY(-3px)}.lp-feat .ln span{color:var(--sub);font-size:calc(13px*var(--ts));text-align:right}
.lp-note{border-radius:16px;padding:14px 16px;margin-bottom:10px;background:var(--cream);box-shadow:0 1px 0 var(--dash)}.lp-note>b{font-size:calc(13px*var(--ts))}
.lp-note.line{background:rgba(6,199,85,.09);box-shadow:none}.lp-note.line>b{color:var(--good)}
.lp-bub{background:var(--card);border-radius:14px 14px 14px 4px;padding:10px 12px;font-size:calc(13px*var(--ts));line-height:1.6;margin-top:8px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.lp-steps{list-style:none;margin:0;padding:0}.lp-steps li{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:1.5px dashed var(--dash);font-size:calc(14px*var(--ts));line-height:1.6}.lp-steps li:last-child{border-bottom:1.5px dashed var(--dash)}
.lp-steps .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--sun);color:var(--sun-ink);display:grid;place-items:center;font-weight:700;font-size:13px}
.lp-faq details{border-top:1.5px dashed var(--dash);padding:12px 0;font-size:calc(14px*var(--ts))}.lp-faq details:last-of-type{border-bottom:1.5px dashed var(--dash)}.lp-faq summary{font-weight:600;cursor:pointer}.lp-faq p{margin:6px 0 0;color:var(--sub);font-size:calc(13px*var(--ts));line-height:1.6}
.lp-cta{padding:24px 0 4px}
.home0-note-sub{color:var(--sub);font-size:calc(11.5px*var(--ts));margin-top:3px}
.home0-note{border:1px solid var(--line);border-radius:14px;padding:9px 12px;font-size:calc(12.5px*var(--ts));line-height:1.5;color:var(--ink);margin:14px 2px 8px}.home0-note b{display:block}
.home0-line{display:flex;flex-direction:column;gap:6px;padding:0 2px}
.home0-line .sub{text-align:center}
.home0 .legal{margin-top:12px}
.lineg.sm{height:36px;font-size:calc(14px*var(--ts))}.lineg.sm img{width:36px;height:36px}.lineg.sm span{padding:0 26px}
.empty b{display:block;color:var(--ink);font-size:calc(17px*var(--ts));margin-bottom:6px}

/* ticket */
.ticket{background:var(--navy);color:#fff;border-radius:24px}
.t-top{padding:12px 20px 10px}
.t-label{font-size:calc(13px*var(--ts));opacity:.75}
.t-amount{font-size:calc(38px*var(--ts));font-weight:700;line-height:1.2;letter-spacing:-.02em}
.t-amount.neg{color:#ff9a92}
.t-bar{height:8px;border-radius:99px;background:rgba(255,255,255,.18);margin-top:8px;overflow:hidden}
.t-bar i{display:block;height:100%;background:var(--sun);border-radius:99px}
.t-bar.over i{background:#ff9a92}
.t-perf{position:relative;height:0;border-top:2px dashed rgba(255,255,255,.28);margin:0 18px}
.t-perf::before,.t-perf::after{content:"";position:absolute;top:-13px;width:24px;height:24px;border-radius:50%;background:var(--paper)}
.t-perf::before{left:-30px}
.t-perf::after{right:-30px}
.t-bot{display:grid;grid-template-columns:auto 1fr;gap:16px;padding:10px 20px 12px}
.t-bot .t-label{white-space:nowrap}
.t-bot b{display:block;font-size:calc(18px*var(--ts));font-weight:700}
.t-bot .warn{color:#ff9a92}
.sav-amt{font-weight:700;font-size:calc(16px*var(--ts));white-space:nowrap}.sav-ok{display:inline-flex;align-items:center;gap:3px;color:var(--good);font-weight:500}
.ticket.c .t-sub{font-size:calc(12px*var(--ts));opacity:.75;margin-top:6px}
.t-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px}.t-row .t-label{white-space:nowrap}
.ticket.m{border-radius:20px}.ticket.m .t-top{padding:10px 18px 8px}.ticket.m .t-amount{font-size:calc(30px*var(--ts));line-height:1.15}.ticket.m .t-bar{height:6px;margin-top:6px}
.ticket.m .t-bot{margin:0 18px;padding:8px 0 10px;border-top:2px dashed rgba(255,255,255,.28)}.ticket.m .t-bot b{font-size:calc(16px*var(--ts))}.ticket.m .t-bot .t-label{font-size:calc(12px*var(--ts))}
.ticket.m .t-hero{margin-top:2px}.ticket.m .t-hero b{font-size:calc(17px*var(--ts));font-weight:700}.ticket.m .t-hero b.warn{color:#ff9a92}.ticket.m .t-foot{margin-top:2px}.ticket.m .t-foot .t-label{font-size:calc(12px*var(--ts))}.ticket.m .t-foot b{font-size:calc(14px*var(--ts));opacity:1;margin-left:2px}
.ufold{display:flex;justify-content:space-between;align-items:center;gap:8px;width:calc(100% - 36px);margin:0 18px;padding:8px 0 10px;border-top:2px dashed rgba(255,255,255,.28);font-size:calc(12px*var(--ts));color:rgba(255,255,255,.8);text-align:left}.ufold em{font-style:normal;color:#ff9a92;margin-left:6px;font-weight:700}
.ticket.c{border-radius:16px;padding:9px 16px 11px}.ticket.c .t-amount{font-size:calc(22px*var(--ts));line-height:1.2}.ticket.c .t-bar{height:5px;margin-top:6px}

/* lists */
/* settings + LINE account sheets: a flat, full-width list (icon, title, note, chevron); groups are split by a thick band, not by cards */
.sheet:has(.pref){background:var(--card);padding-left:0;padding-right:0}
.sheet:has(.pref)>.row{padding:0 16px 8px}
.sheet:has(.pref) h2{font-size:calc(20px*var(--ts));letter-spacing:.01em}
.sheet:has(.pref) .sheet-foot{padding-left:16px;padding-right:16px}
.sheet-body.pref{padding:0 0 16px;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 10px,#000 calc(100% - 14px),transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 10px,#000 calc(100% - 14px),transparent 100%)}   /* content fades out under the title instead of being cut */
.pref .list{background:none;border:0;border-radius:0;overflow:visible}
.pref .item{border-top:0}
.sechd{font-family:var(--mono);letter-spacing:.06em;font-size:calc(13px*var(--ts));font-weight:500;color:var(--sub);margin:0;padding:22px 20px 6px;border-top:8px solid var(--paper)}
.pref>.sechd:first-child{border-top:0;padding-top:8px}
.acc-me{display:flex;align-items:center;gap:14px;padding:12px 20px 22px}
.acc-me .av{width:64px;height:64px;font-size:calc(24px*var(--ts))}
.acc-me .t{font-size:calc(19px*var(--ts));font-weight:700;line-height:1.3}
.acc-me .sub{margin-top:1px}
.item.acc{padding:13px 20px;gap:14px;align-items:center;min-height:56px}
.item.acc .t{font-size:calc(16px*var(--ts));line-height:1.4;overflow-wrap:break-word}
.item.acc .sub{font-size:calc(13px*var(--ts));line-height:1.55;margin-top:2px;line-break:strict}
.item.acc>svg,.item.acc .chev{flex:none;color:var(--sub)}
.chev{display:grid;place-items:center;transition:transform .15s}.chev.open{transform:rotate(90deg)}
.ico{flex:none;width:34px;height:34px;display:grid;place-items:center start;color:var(--ink)}   /* the icon column: icons, the avatar and the app icon share one width, so every title lines up */
.ico svg{width:26px;height:26px}
.ico img{width:30px;height:30px;border-radius:8px;display:block}
.ico.bad{color:var(--bad)}
.item.acc .btn.sm{width:84px;padding:8px 0;font-size:calc(14px*var(--ts));border-radius:12px;text-align:center}
.btn.sm{width:auto;flex:none;padding:7px 14px;font-size:calc(14px*var(--ts));border-radius:12px}
.acc-note{margin:4px 20px 18px;line-height:1.6;line-break:strict}
.item.acc .bad-t{color:var(--bad)}
.acc-del{margin:14px 20px 0;border-color:var(--bad)}
.item.acc{text-align:left;color:inherit;text-decoration:none}
.item.acc.sub-row{padding-left:68px}.item.acc.sub-row .ico{display:none}   /* the 「うまく届かないとき」 helpers: stepped in under their title */
.pref .acc-danger{border-top:8px solid var(--paper);margin-top:4px}
.av.s34{width:34px;height:34px;font-size:calc(15px*var(--ts))}
.sw{position:relative;flex:none;width:51px;height:31px;border-radius:99px;background:#b4bfcc;transition:background .15s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.sw[aria-checked=true]{background:var(--good)}.sw[aria-checked=true]::after{transform:translateX(20px)}
.sw:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sec{margin-top:16px}
.sec>h2{font-size:calc(15px*var(--ts));font-weight:700;margin:0 0 6px;display:flex;justify-content:space-between;align-items:baseline}
.sec>h2 span{font-size:calc(13px*var(--ts));font-weight:500;color:var(--sub)}
#exp-list .sec>h2{position:sticky;top:0;z-index:2;background:var(--paper);margin:0;padding:8px 2px 6px}   /* the date heading stays at the top while its day's expenses scroll under it */
.list{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:10px 14px;width:100%;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .t{font-weight:500;overflow-wrap:anywhere}
.item .amt{font-weight:700;white-space:nowrap}
.seg{display:flex;gap:2px;height:12px;border-radius:99px;overflow:hidden;margin:4px 0 12px;background:var(--soft)}
.seg i{background:hsl(var(--h) 70% 55%)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:calc(13px*var(--ts))}
.legend div{display:flex;align-items:center;gap:6px}
.legend .dot{width:10px;height:10px;border-radius:50%;background:hsl(var(--h) 70% 55%);flex:none}
.legend em{margin-left:auto;font-style:normal;font-weight:500}
.usage{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px}
.usage .seg{margin:0 0 8px;height:10px}
.legend2{display:flex;flex-wrap:wrap;gap:6px;font-size:calc(12px*var(--ts));color:var(--sub)}
.segbtn{display:block;width:100%;padding:6px 0;margin:-6px 0 -2px}
.lc{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:99px;border:1.5px solid var(--line);font:inherit;font-size:calc(12px*var(--ts));color:var(--sub);background:transparent}.lc[aria-pressed=true]{border-color:var(--sun);background:var(--soft);color:var(--ink)}
.usage.in .lc{border-color:rgba(255,255,255,.28);color:rgba(255,255,255,.85)}.usage.in .lc[aria-pressed=true]{border-color:var(--sun);background:rgba(255,255,255,.18);color:#fff}.usage.in .lc b{color:#fff}
.fline{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:8px 2px 0;font-size:calc(13px*var(--ts));color:var(--sub)}.fline .link{color:var(--ink);font-weight:600}
.usage{display:block;width:100%;text-align:left;font:inherit;color:inherit}.usage.thin{padding:8px 14px;font-size:calc(13px*var(--ts));color:var(--sub);text-align:center}.legend2 .over{color:var(--bad);font-weight:700}
.subrow{display:flex;align-items:center;justify-content:space-between;gap:8px}.subrow .mem-row{margin:0;flex:none}.subrow .mem-row .btn.sm{min-height:44px;padding:5px 14px;font-size:calc(13px*var(--ts))}
.usage.in{background:none;border:0;border-radius:0;padding:0 18px 12px;color:#fff}.usage.in .seg{background:rgba(255,255,255,.18);height:8px;margin:0 0 7px}.usage.in .legend2{color:rgba(255,255,255,.78)}.usage.in .legend2 .over{color:#ff9a92}.usage.in.thin{padding:8px 0 12px;color:rgba(255,255,255,.7);text-align:left;border-top:2px dashed rgba(255,255,255,.28);margin:0 18px;width:auto}
.legend2 .dot{width:8px;height:8px;border-radius:50%;background:hsl(var(--h) 70% 55%)}
.legend2 b{color:var(--ink)}
.panel{background:var(--cream);border:1.5px dashed var(--dash);border-radius:20px;padding:16px}

/* settle */
.xfer{display:flex;align-items:center;gap:8px;padding:8px 12px}
.xfer.done .avs,.xfer.done .names,.xfer.done .amt{opacity:.5}
.xfer.done .names .nm,.xfer.done .amt{text-decoration:line-through}
.xgroup{margin-bottom:8px}.xgroup:last-child{margin-bottom:0}.xhead{display:flex;justify-content:space-between;align-items:baseline;padding:0 6px 4px;font-size:calc(13px*var(--ts));color:var(--sub);font-weight:500}
.xhead span:first-child{color:var(--ink);font-weight:700}
.xgroup .xfer .avs .av{width:28px;height:28px;font-size:calc(13px*var(--ts))}
.xfer+.xfer{border-top:1px solid var(--line)}
.xfer{flex-wrap:wrap}.rline{flex-basis:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:30px;padding:0 0 0 36px;font-size:calc(12px*var(--ts));color:var(--sub)}.rline .link{width:auto;flex:none;padding:4px 6px;font-size:calc(12px*var(--ts));font-weight:700;color:var(--ink)}.rbtn{flex:none;min-height:30px;padding:0 12px;border-radius:99px;background:var(--sun);color:var(--sun-ink);font:inherit;font-size:calc(13px*var(--ts));font-weight:700}
.noteRow{padding:4px 12px!important;font-size:calc(13px*var(--ts));color:var(--sub)}.noteRow .grow{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list.xl{margin-top:8px}.xfer{padding:10px 12px}
.xnote{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:-4px 4px 10px;font-size:calc(13px*var(--ts));color:var(--sub)}.xnote .link{width:auto;flex:none;padding:6px 8px;font-size:calc(13px*var(--ts));font-weight:700;color:var(--ink)}.xnote>span:first-child{min-width:0;flex:1 1 auto;overflow-wrap:anywhere}.xnote .xact{display:flex;align-items:center;flex:none}.xnote a.link{text-decoration:underline;text-underline-offset:3px}.noteRow{margin-bottom:10px}
.paidbtn{flex:none;display:inline-flex;align-items:center;gap:3px;min-height:34px;padding:0 10px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:calc(13px*var(--ts));font-weight:500;white-space:nowrap}
.paidbtn .ring{display:inline-block;width:15px;height:15px;border-radius:50%;border:2px solid currentColor;opacity:.75;box-sizing:border-box}
.paidbtn.on{background:var(--good);border-color:var(--good);color:#fff}
.xfer .names{flex:1;min-width:0;font-weight:500;font-size:calc(14px*var(--ts));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xfer .amt{font-weight:700;font-size:calc(16px*var(--ts));white-space:nowrap}
.chk{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent;flex:none}
.chk.on{background:var(--good);border-color:var(--good);color:#fff}
.plus-or-minus.pos{color:var(--good)}
.plus-or-minus.neg{color:var(--bad)}

/* buttons / forms */
.btn{display:block;width:100%;background:var(--sun);color:var(--sun-ink);border-radius:16px;padding:15px 18px;font-size:calc(16px*var(--ts));font-weight:700;text-align:center}
.btn.line{background:none;color:var(--ink);border:1.5px solid var(--line);padding:12px 16px;font-size:calc(15px*var(--ts))}
.btn.bad{background:var(--bad);color:#fff}
.link{color:var(--sub);font-size:calc(14px*var(--ts));font-weight:500;padding:10px 0;text-align:center;width:100%}
.link.bad{color:var(--bad)}
.field{width:100%;font:inherit;font-size:calc(16px*var(--ts));padding:13px 14px;border-radius:14px;border:1.5px solid var(--dash);background:var(--cream);color:var(--ink)}
.field:focus{border-color:var(--focus);outline:none}
.lab{display:block;font-family:var(--mono);letter-spacing:.05em;font-size:calc(13px*var(--ts));color:var(--sub);font-weight:500;margin:20px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;border-radius:99px;border:1.5px solid var(--dash);background:var(--cream);font-weight:500;font-size:calc(14px*var(--ts))}
.chip.plain{padding:9px 14px}
.chip.on{border-color:var(--navy);background:var(--navy);color:#fff;font-weight:700}
@media (prefers-color-scheme:dark){.chip.on{border-color:var(--focus)}}
.datebox{position:relative;display:flex;align-items:center;cursor:pointer}
.datebox span{pointer-events:none}
.datebox input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:calc(16px*var(--ts))}
.alone{margin-top:18px;padding:14px;border:1.5px dashed var(--line);border-radius:16px;text-align:center}
.alone .btn{width:auto;margin:10px auto 0;padding:8px 16px}
.btn:disabled{opacity:.4;pointer-events:none}
.chip .av{width:26px;height:26px;font-size:calc(13px*var(--ts))}
.catgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.cat{display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 2px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-weight:500;font-size:calc(11px*var(--ts));line-height:1.2;white-space:nowrap}
.cat .tag{width:30px;height:30px;border-radius:10px;font-size:calc(14px*var(--ts))}
.cat.on{border-color:var(--ink);border-width:2px}
.field.bad{border-color:var(--bad)}.ferr{color:var(--bad);font-size:calc(13px*var(--ts));margin:6px 2px 0}.err{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad);padding:10px 12px;border-radius:12px;font-size:calc(14px*var(--ts));font-weight:500;margin-top:14px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.two>*{min-width:0}
@media(max-width:350px){.two input[type=date].field{font-size:calc(14px*var(--ts));padding-left:10px;padding-right:8px}}
input[type=date].field{min-width:0;max-width:100%;min-height:50px;-webkit-appearance:none;appearance:none;text-align:left;display:block}
input[type=date].field::-webkit-date-and-time-value{text-align:left}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(5,12,22,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet:focus{outline:none}
.sheet{background:var(--paper);width:100%;max-width:520px;max-height:97%;display:flex;flex-direction:column;border-radius:26px 26px 0 0;padding:10px 16px 0;overflow:hidden}   /* 10px, not 16: the close button is 44px now, and the sheets must still fit one screen */
.sheet-body{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-bottom:6px}
.sheet-foot{flex:none;padding:8px 0 calc(env(safe-area-inset-bottom) + 14px)}
.sheet .lab{margin:10px 0 5px}
.sheet .field{padding:10px 12px}
.sheet input[type=date].field{min-height:44px}
.sheet .chips{gap:6px}
.sheet .chip{padding:4px 12px 4px 4px;font-size:calc(13px*var(--ts))}
.sheet .chip.plain{padding:7px 12px}
.memo-row{display:grid;grid-template-columns:minmax(0,1fr) 148px;gap:8px;margin-top:6px}
.memo-row .field{padding:11px 12px}
.sheet .two .lab{margin-top:10px}
.sheet h2{font-size:calc(18px*var(--ts));font-weight:700;margin:0}
.amount-wrap{display:flex;align-items:baseline;justify-content:center;gap:4px;margin-top:6px;padding:10px 14px;border:1.5px solid var(--dash);border-radius:16px;background:var(--cream);cursor:text}
.amount-wrap:focus-within{border-color:var(--focus)}
.amount{font:inherit;font-size:calc(38px*var(--ts));font-weight:700;border:0;background:none;color:var(--ink);padding:0;min-width:1ch;max-width:calc(100% - 40px);letter-spacing:-.02em;text-align:left}
.amount:focus{outline:none}
.amount::placeholder{color:var(--line)}

  if (st === '準備中'){ const d = dayDiff(today, t.start); return 'あと' + d + '日で出発'; }
  const ss = t.settlements || [], open = openItems(t), has = open.expenses.length > 0 || open.adjustments.length > 0;
  if (!has) return ss.length ? '精算は済んでいます' : '';

  const n = ss.length + 1, un = pays.filter(p => !t.paid[payKey(n, p)]).length;
  return un ? '精算があと' + un + '件' : '精算を確定しましょう';

/* 受け取りの確認（任意）: 「払った」が付いた送金に、受け取る人が「受け取った」を押せる。数え方（あと◯件・精算が済んだ）は、「払った」のまま */

  else if (a === 'hint-swipe-no'){ lsSet(HINT_SWIPE, '1'); render(); return; }
  else if (a === 'copy-note'){ const m = t.members.find(x => x.id === id), v = m && m.note; if (!v) return; try { navigator.clipboard.writeText(v).then(() => flash('コピーしました'), () => flash(v)); } catch(err){ flash(v); } return; }
  else if (a === 'quick-chip'){   // the content goes into the box; the number keyboard opens for the amount (a tap on a chip is the one time the box takes focus by itself)
    const inp = document.getElementById('q-quick'), v = el.getAttribute('data-v'); if (!inp) return;
    const cur = (inp.value || '').trim(), amountOnly = /^[0-9０-９,，]+\s*円?$/.test(cur);
    inp.value = v + ' ' + (amountOnly ? cur : ''); ui.quick = inp.value; ui.quickErr = '';
    inp.setAttribute('inputmode', 'numeric'); inp.addEventListener('blur', () => inp.setAttribute('inputmode', 'text'), { once: true });
    const err = document.querySelector('.quick + .err'); if (err) err.remove();
    inp.focus(); try { inp.setSelectionRange(inp.value.length, inp.value.length); } catch (e2) {}
    return;
  }
  else if (a === 'ai-photo'){ if (!ui.ai.login){ ui.quickErr = 'LINEでログインすると、たびまるに頼めます。'; render(); return; } const f = document.getElementById('ai-file'); if (f){ f.value = ''; f.click(); } return; }
  else if (a === 'ai-toggle'){ const i = +el.getAttribute('data-i'); s.picked[i] = !s.picked[i]; }
  else if (a === 'ai-record' || a === 'ai-edit'){
    const recs = (s.result ? s.result.items : []).map(x => aiExpense(t, x)), take = recs.filter((r, i) => r && s.picked[i]);
    if (!take.length){ if (a === 'ai-edit'){ ui.sheet = null; render(); } return; }
    if (a === 'ai-edit'){
      const rec = take[0];
      ui.sheet = { type: 'exp', err: '', editId: null, partsOpen: !!rec.fixed, data: { amount: String(rec.amount), title: rec.title, cat: rec.cat, payer: rec.payer, all: rec.split.length === t.members.length, split: rec.split.slice(), date: rec.date, parts: {},
        fixed: rec.fixed ? Object.fromEntries(Object.keys(rec.fixed).map(k => [k, String(rec.fixed[k])])) : {} } };
    } else {
      const tid = t.id, before = catSums(t), fulls = take.map(rec => stampNew(t, Object.assign({ id: uid() }, rec))); fulls.forEach(f => t.expenses.push(f)); ui.fresh = {}; fulls.forEach(f => { ui.fresh[f.id] = 1; }); ui.sheet = null; ui.quick = ''; save(); render();
      const cn = capNotice(t, before), one = take[0], total = take.reduce((x, r) => x + r.amount, 0);
      flash((take.length > 1 ? take.length + '件（合わせて ' + yen(total) + '）' : (one.title || (CAT[one.cat] || CAT.other)[2]) + ' ' + yen(one.amount)) + 'を記録しました' + (cn ? '。' + cn : ''), () => { const tt = state.trips.find(x => x.id === tid); if (!tt) return; const ids = fulls.map(f => f.id); tt.expenses = tt.expenses.filter(q => ids.indexOf(q.id) < 0); save(); render(); });
      return;
    }
  }
  else if (a === 'cat-filter'){ const v = el.getAttribute('data-v'); ui.catF = (!v || ui.catF === v) ? null : v; }
  else if (a === 'find-toggle'){ if (ui.qOpen || ui.q){ ui.q = ''; ui.qOpen = false; ui.catF = null; ui.swp = null; } else ui.qOpen = true; }
  else if (a === 'toggle-round'){ const n = el.getAttribute('data-v'); ui.rounds = ui.rounds || {}; ui.rounds[n] = !ui.rounds[n]; }
  else if (a === 'welcome-ok'){ lsSet('tabiwari.welcome.' + t.id, null); }
  else if (a === 'caps-edit'){ ui.sheet = { type: 'caps', err: '' }; }
  else if (a === 'caps-save'){
    const caps = {}; let bad = false;
    document.querySelectorAll('[data-cap]').forEach(el => { const v = el.value.trim(); if (!v) return; const n = parseYen(v); if (!(n >= 1 && n <= 1e9)) bad = true; else caps[el.getAttribute('data-cap')] = n; });
    if (bad) s.err = '上限は、1以上の数字で入力してください。空にすると、上限なしです。';
    else { if (Object.keys(caps).length) t.caps = caps; else delete t.caps; save(); ui.sheet = null; render(); flash(Object.keys(caps).length ? '上限を保存しました' : '上限を外しました'); return; }
  }
  else if (a === 'quick-save'){ document.getElementById('f-save').value = el.getAttribute('data-v'); return; }
  else if (a === 'save-saving'){
    const n = parseYen(document.getElementById('f-save').value);
    if (!(n !== 0 && !isNaN(n))) s.err = '金額を数字で入力してください（例：5000）。';
    else if (!saveApply(t, s.id, { kind: 'add', id: uid(), a: n, d: todayStr(), by: meId(t) })) s.err = '履歴がいっぱいです（300件まで）。いちばん古い記録を、消してください。';
    else { const fl0 = n > 0 ? flyFrom() : null; save(); ui.sheet = null; ui.stnWait = Math.round(FLY_MS * .75); render(); if (fl0) recFly('+' + yen(n), fl0); flash('記録しました'); return; }
  }

  else if (a === 'settings'){ ui.sheet = { type: 'settings', err: '', confirmDel: false, data: { name: t.name, start: t.start, end: t.end, budget: String(t.budget) } }; }
  else if (a === 'rm-tmember'){ readSheet(); t.members = t.members.filter(m => m.id !== id); save(); }
  else if (a === 'save-settings'){
    readSheet(); const d = s.data, b = parseYen(d.budget);
    if (!d.name.trim()) s.err = '旅行の名前を入力してください。';
    else if (d.end < d.start) s.err = '帰着日は、出発日と同じか、それ以降にしてください。';
    else if (!(b > 0)) s.err = '予算を、1以上の数字で入力してください。';
    else {
      t.name = d.name.trim(); t.start = d.start; t.end = d.end; t.budget = b; save(); ui.sheet = null; render(); flash('保存しました'); return;
    }
  }
  else if (a === 'ask-del-trip'){ readSheet(); s.confirmDel = true; }
  else if (a === 'del-trip-cancel'){ s.confirmDel = false; }
  else if (a === 'del-trip'){
    const ix = state.trips.findIndex(x => x.id === t.id), gone = t;
    state.trips = state.trips.filter(x => x.id !== t.id); lsSet(GONE_KEY, JSON.stringify(readGone().concat(gone.id))); save(); if (lineAcct.user) bkSoon(); ui.sheet = null; ui.view = 'home'; ui.tripId = null; render();
    flash('旅行を削除しました', () => { if (state.trips.some(x => x.id === gone.id)) return; state.trips.splice(Math.min(ix, state.trips.length), 0, gone); lsSet(GONE_KEY, JSON.stringify(readGone().filter(id => id !== gone.id))); const sg = readSigs(); delete sg[gone.id]; lsSet(BK_SIGS, JSON.stringify(sg)); save(); render(); flash('元に戻しました'); });
    return;
  }
  else if (a === 'close-sheet'){ ui.sheet = (s && s.back) || null; ui.sheetBack = !!(s && s.back); }
  render();
});

render();
bootShare();
{ const sp = document.getElementById('splash'); if (sp){ requestAnimationFrame(() => { sp.classList.add('out'); setTimeout(() => sp.remove(), 300); }); } }   // the first screen is drawn: let the splash go
</script>
