<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>たびわり</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f2742">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="たびわり">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
/* Layout idea: one column phone app. A navy boarding-pass card shows what is left; amber is the single action colour; bottom tab bar. */
:root{
  --paper:#eef2f7; --card:#ffffff; --ink:#0e2238; --sub:#5b6b80; --line:#dde4ee; --soft:#e6ecf5;
  --navy:#0f2742; --sun:#ffc83d; --sun-ink:#2a1d00; --good:#17895c; --bad:#c2332d; --focus:#2f6fed;
  --tbs:85%; --tbl:92%; --tfs:55%; --tfl:30%;
  --font:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0a1626; --card:#12243a; --ink:#e9f0fa; --sub:#93a3b8; --line:#243750; --soft:#1a2f4a;
    --navy:#17375e; --good:#4cc795; --bad:#ff7a73; --focus:#7aa2ff;
    --tbs:38%; --tbl:24%; --tfs:75%; --tfl:82%; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0a1626; --card:#12243a; --ink:#e9f0fa; --sub:#93a3b8; --line:#243750; --soft:#1a2f4a;
  --navy:#17375e; --good:#4cc795; --bad:#ff7a73; --focus:#7aa2ff;
  --tbs:38%; --tbl:24%; --tfs:75%; --tfl:82%; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-weight:400;line-height:1.55;font-variant-numeric:tabular-nums}
b,strong{font-weight:500}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
#app{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 8px) 16px calc(env(safe-area-inset-bottom) * .5 + 84px)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.sub{color:var(--sub);font-size:13px}
.sm{font-size:12px}
.num{font-weight:700;font-size:18px}
.right{text-align:right}

/* header */
.brand{font-size:30px;font-weight:700;letter-spacing:.02em;margin:6px 0 2px}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:10px}.brandrow .iconbtn{margin-top:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#app.fit{height:100%;overflow:hidden;display:flex;flex-direction:column;padding-bottom:0}
#app.fit>*{flex:none}
#app.fit>.sp{display:block;flex:10 1 0;min-height:6px;max-height:24px}
#app.fit>.scroll{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;margin:0 -16px;padding:0 16px 8px}
#app.nonav{padding-bottom:calc(env(safe-area-inset-bottom) * .5 + 10px)}
.cta{padding-top:10px}
.scroll>.lab:first-child{margin-top:6px}
.scroll>.lab,.scroll .two .lab{margin-top:14px}
.scroll>.sec:first-child{margin-top:0}
.scroll .sec{margin-top:10px}
.item.slim{padding:6px 12px;gap:10px;line-height:1.4}
.top{display:flex;align-items:center;gap:10px;margin-bottom:0}
.top h1{font-size:18px;font-weight:700;margin:0;flex:1;min-width:0;overflow-wrap:anywhere;text-wrap:balance}
.iconbtn{width:40px;height:40px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.pill{font-size:12px;font-weight:500;padding:3px 10px;border-radius:99px;white-space:nowrap;background:var(--soft);color:var(--sub)}
.pill.now{background:var(--sun);color:var(--sun-ink)}

/* tags and avatars share one hue system */
.tag,.av{--h:215;background:hsl(var(--h) var(--tbs) var(--tbl));color:hsl(var(--h) var(--tfs) var(--tfl));display:grid;place-items:center;font-weight:700;flex:none}
.tag{width:42px;height:42px;border-radius:14px;font-size:17px}
.av{width:30px;height:30px;border-radius:50%;font-size:14px}
.avs{display:flex}
.avs .av{border:2px solid var(--card);margin-left:-8px}
.avs .av:first-child{margin-left:0}
.pill.wait{background:none;border:1.5px dashed var(--sub);color:var(--sub);padding:1px 9px}

/* home */
.trip{display:block;width:100%;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px 16px;margin-top:10px}
.trip-name{font-size:18px;font-weight:700;overflow-wrap:anywhere}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:12px}
.bar>i{display:block;height:100%;background:var(--navy);border-radius:99px}
.bar.over>i{background:var(--bad)}
.legal a{color:var(--sub)}
.chip .x{width:24px;height:24px;display:grid;place-items:center;color:var(--sub);font-size:18px;line-height:1;margin-left:2px}
.install.col{flex-direction:column;align-items:stretch;gap:8px}
/* LINE Login button, built to LINE's design guidelines: #06C755, white text, official icon (icons/line-login-icon.png, unmodified), 8% black divider, hover +10% / press +30% black */
.lineg{position:relative;display:flex;align-items:stretch;width:100%;height:44px;padding:0;border-radius:6px;overflow:hidden;background:#06c755;color:#fff;font-size:16px;font-weight:700;white-space:nowrap}
.lineg img{display:block;width:44px;height:44px;flex:none;border-right:1px solid rgba(0,0,0,.08);box-sizing:border-box}
.lineg span{flex:1;display:flex;align-items:center;justify-content:center;padding:0 32px}
.lineg::after{content:"";position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:0}   /* layer order from LINE's guideline: base colour, then the black overlay, then the divider and the white text/logo on top */
.lineg:active::after{opacity:.3}   /* pressed only: black 30% (no hover shade) */
.lineg img,.lineg span{position:relative;z-index:1}
.lineg:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.install{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin-top:10px;font-size:13px}
.install .btn{width:auto;padding:8px 14px;font-size:14px;flex:none}
.install .btn.sm{padding:7px 12px}
.ic-inline{display:inline-block;vertical-align:-3px}
.install .x{width:32px;height:32px;display:grid;place-items:center;color:var(--sub);flex:none}
.empty{text-align:center;padding:34px 12px;color:var(--sub)}
.exp0{padding:6px 12px 0;white-space:nowrap}.exp0 b{display:block;font-size:16px;margin-bottom:2px}.exp0 span{display:block;font-size:14px}.exp0 .btn{width:min(100%,280px);margin:16px auto 0;padding:13px 18px;font-size:15px}
.mem-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}
.mem-row .btn.sm{width:auto;flex:none;padding:7px 14px;font-size:14px;border-radius:12px}
.home0{display:flex;flex-direction:column;height:100%;min-height:0;overflow-y:auto;padding-bottom:calc(env(safe-area-inset-bottom) * .5 + 12px)}
.home0>*{flex:none}
.home0-intro{text-align:center;color:var(--sub);font-size:min(14px, calc((100vw - 36px) / 27.5));line-height:1.6;padding:18px 0 16px;white-space:nowrap}
.home0-intro b{display:block;color:var(--ink);font-size:20px;font-weight:700;margin-bottom:4px}
@media (max-height:700px){.home0-intro{padding:8px 0 10px}.home0-steps{gap:10px;padding:10px 4px}.home0 .legal{margin-top:8px}.home0.sa .home0-steps{padding:10px 4px 0;gap:10px}.home0.sa .home0-intro{padding:2px 0 8px}.home0.sa>.home0-mid{padding-bottom:4px}}
.home0-steps{list-style:none;margin:0;padding:0;flex:1 0 auto;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:18px 4px}
.home0-steps li{display:flex;gap:14px;align-items:center}
.home0-steps .n{width:32px;height:32px;border-radius:50%;background:var(--soft);color:var(--ink);font-weight:700;display:grid;place-items:center;flex:none}
.home0-steps b{display:block;font-size:15px}.home0-steps span:not(.n){display:block;color:var(--sub);font-size:13px}
.home1{display:flex;flex-direction:column;min-height:calc(100vh - 92px - env(safe-area-inset-top) - env(safe-area-inset-bottom) * .5)}
@supports (height:100dvh){.home1{min-height:calc(100dvh - 92px - env(safe-area-inset-top) - env(safe-area-inset-bottom) * .5)}}
.home1-foot{margin-top:auto;padding-top:16px}
.foot1{text-align:center;white-space:nowrap}.foot1 button{color:var(--sub);text-decoration:underline;font:inherit;padding:8px 0}.foot1 a{display:inline-block;padding:8px 0}
.btn.inv{margin-top:8px;padding:10px 14px;font-size:14px;border-radius:14px}
.btn.inv.join{margin-top:14px;color:var(--sub);font-weight:500;border-style:dashed}
.home0-mid,.home0-bottom{display:contents}   /* in the browser the two groups are transparent: the layout is the one with the steps stretching */
/* opened from the home screen: no banner space to fill, so the buttons and steps sit close together, centred between the title and the LINE row; LINE and the legal links stay at the bottom */
.home0.sa>.home0-mid{display:flex;flex-direction:column;flex:1 0 auto;justify-content:center;padding-bottom:8px}
.home0.sa>.home0-bottom{display:block}
.home0.sa .home0-steps{flex:none;padding:18px 4px 0;gap:14px}
.home0.sa .home0-intro{padding-top:6px}
.home0-line{display:flex;flex-direction:column;gap:6px;padding:0 2px}
.home0-line .sub{text-align:center}
.home0 .legal{margin-top:12px}
.lineg.sm{height:36px;font-size:14px}.lineg.sm img{width:36px;height:36px}.lineg.sm span{padding:0 26px}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}

/* ticket */
.ticket{background:var(--navy);color:#fff;border-radius:24px}
.t-top{padding:12px 20px 10px}
.t-label{font-size:13px;opacity:.75}
.t-amount{font-size:38px;font-weight:700;line-height:1.2;letter-spacing:-.02em}
.t-amount.neg{color:#ff9a92}
.t-bar{height:8px;border-radius:99px;background:rgba(255,255,255,.18);margin-top:8px;overflow:hidden}
.t-bar i{display:block;height:100%;background:var(--sun);border-radius:99px}
.t-bar.over i{background:#ff9a92}
.t-perf{position:relative;height:0;border-top:2px dashed rgba(255,255,255,.28);margin:0 18px}
.t-perf::before,.t-perf::after{content:"";position:absolute;top:-13px;width:24px;height:24px;border-radius:50%;background:var(--paper)}
.t-perf::before{left:-30px}
.t-perf::after{right:-30px}
.t-bot{display:grid;grid-template-columns:auto 1fr;gap:16px;padding:10px 20px 12px}
.t-bot .t-label{white-space:nowrap}
.t-bot b{display:block;font-size:18px;font-weight:700}
.t-bot .warn{color:#ff9a92}
.t-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px}.t-row .t-label{white-space:nowrap}
.ticket.m{border-radius:20px}.ticket.m .t-top{padding:10px 18px 8px}.ticket.m .t-amount{font-size:30px;line-height:1.15}.ticket.m .t-bar{height:6px;margin-top:6px}
.ticket.m .t-bot{margin:0 18px;padding:8px 0 10px;border-top:2px dashed rgba(255,255,255,.28)}.ticket.m .t-bot b{font-size:16px}.ticket.m .t-bot .t-label{font-size:12px}
.ticket.c{border-radius:16px;padding:9px 16px 11px}.ticket.c .t-amount{font-size:22px;line-height:1.2}.ticket.c .t-bar{height:5px;margin-top:6px}

/* lists */
/* LINE account sheet */
.sechd{font-size:13px;font-weight:700;color:var(--sub);margin:18px 4px 6px}
.acc-me{display:flex;align-items:center;gap:12px;margin-top:12px;padding:4px 4px}
.acc-me .av{width:44px;height:44px;font-size:18px}
.acc-me .t{font-size:17px;font-weight:700}
.item.acc{padding:12px 14px}
.item.acc>svg,.item.acc .chev{flex:none;color:var(--sub)}
.chev{display:grid;place-items:center;transition:transform .15s}.chev.open{transform:rotate(90deg)}
.btn.sm{width:auto;flex:none;padding:7px 14px;font-size:14px;border-radius:12px}
.acc-note{margin:8px 4px 0}
.item.acc .bad-t{color:var(--bad)}
.acc-del{margin-top:10px;border-color:var(--bad)}
.item.acc{text-align:left;color:inherit;text-decoration:none}
.sw{position:relative;flex:none;width:51px;height:31px;border-radius:99px;background:#b4bfcc;transition:background .15s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.sw[aria-checked=true]{background:var(--good)}.sw[aria-checked=true]::after{transform:translateX(20px)}
.sw:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sec{margin-top:16px}
.sec>h2{font-size:15px;font-weight:700;margin:0 0 6px;display:flex;justify-content:space-between;align-items:baseline}
.sec>h2 span{font-size:13px;font-weight:500;color:var(--sub)}
.list{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:10px 14px;width:100%;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .t{font-weight:500;overflow-wrap:anywhere}
.item .amt{font-weight:700;white-space:nowrap}
.seg{display:flex;gap:2px;height:12px;border-radius:99px;overflow:hidden;margin:4px 0 12px;background:var(--soft)}
.seg i{background:hsl(var(--h) 70% 55%)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:13px}
.legend div{display:flex;align-items:center;gap:6px}
.legend .dot{width:10px;height:10px;border-radius:50%;background:hsl(var(--h) 70% 55%);flex:none}
.legend em{margin-left:auto;font-style:normal;font-weight:500}
.usage{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px}
.usage .seg{margin:0 0 8px;height:10px}
.legend2{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:12px;color:var(--sub)}
.legend2 span{display:inline-flex;align-items:center;gap:5px}
.legend2 .dot{width:8px;height:8px;border-radius:50%;background:hsl(var(--h) 70% 55%)}
.legend2 b{color:var(--ink)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px}

/* settle */
.xfer{display:flex;align-items:center;gap:8px;padding:8px 12px}
.xfer.done .avs,.xfer.done .names,.xfer.done .amt{opacity:.5}
.xfer.done .names .nm,.xfer.done .amt{text-decoration:line-through}
.xgroup{margin-bottom:8px}.xgroup:last-child{margin-bottom:0}.xhead{display:flex;justify-content:space-between;align-items:baseline;padding:0 6px 4px;font-size:13px;color:var(--sub);font-weight:500}
.xhead span:first-child{color:var(--ink);font-weight:700}
.xgroup .xfer .avs .av{width:28px;height:28px;font-size:13px}
.xfer+.xfer{border-top:1px solid var(--line)}
.paidbtn{flex:none;display:inline-flex;align-items:center;gap:3px;min-height:34px;padding:0 10px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:13px;font-weight:500;white-space:nowrap}
.paidbtn.on{background:var(--good);border-color:var(--good);color:#fff}
.xfer .names{flex:1;min-width:0;font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xfer .amt{font-weight:700;font-size:16px;white-space:nowrap}
.chk{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent;flex:none}
.chk.on{background:var(--good);border-color:var(--good);color:#fff}
.plus-or-minus.pos{color:var(--good)}
.plus-or-minus.neg{color:var(--bad)}

/* buttons / forms */
.btn{display:block;width:100%;background:var(--sun);color:var(--sun-ink);border-radius:16px;padding:15px 18px;font-size:16px;font-weight:700;text-align:center}
.btn.line{background:none;color:var(--ink);border:1.5px solid var(--line);padding:12px 16px;font-size:15px}
.btn.bad{background:var(--bad);color:#fff}
.link{color:var(--sub);font-size:14px;font-weight:500;padding:10px 0;text-align:center;width:100%}
.link.bad{color:var(--bad)}
.field{width:100%;font:inherit;font-size:16px;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.field:focus{border-color:var(--focus);outline:none}
.lab{display:block;font-size:13px;color:var(--sub);font-weight:500;margin:20px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);font-weight:500;font-size:14px}
.chip.plain{padding:9px 14px}
.chip.on{border-color:var(--navy);background:var(--navy);color:#fff;font-weight:700}
@media (prefers-color-scheme:dark){.chip.on{border-color:var(--focus)}}
.datebox{position:relative;display:flex;align-items:center;cursor:pointer}
.datebox span{pointer-events:none}
.datebox input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:16px}
.alone{margin-top:18px;padding:14px;border:1.5px dashed var(--line);border-radius:16px;text-align:center}
.alone .btn{width:auto;margin:10px auto 0;padding:8px 16px}
.btn:disabled{opacity:.4;pointer-events:none}
.chip .av{width:26px;height:26px;font-size:13px}
.catgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.cat{display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 2px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-weight:500;font-size:11px;line-height:1.2;white-space:nowrap}
.cat .tag{width:30px;height:30px;border-radius:10px;font-size:14px}
.cat.on{border-color:var(--ink);border-width:2px}
.err{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad);padding:10px 12px;border-radius:12px;font-size:14px;font-weight:500;margin-top:14px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.two>*{min-width:0}
input[type=date].field{min-width:0;max-width:100%;min-height:50px;-webkit-appearance:none;appearance:none;text-align:left;display:block}
input[type=date].field::-webkit-date-and-time-value{text-align:left}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(5,12,22,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet:focus{outline:none}
.sheet{background:var(--paper);width:100%;max-width:520px;max-height:97%;display:flex;flex-direction:column;border-radius:26px 26px 0 0;padding:16px 16px 0;overflow:hidden}
.sheet-body{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-bottom:6px}
.sheet-foot{flex:none;padding:8px 0 calc(env(safe-area-inset-bottom) + 14px)}
.sheet .lab{margin:10px 0 5px}
.sheet .field{padding:10px 12px}
.sheet input[type=date].field{min-height:44px}
.sheet .chips{gap:6px}
.sheet .chip{padding:4px 12px 4px 4px;font-size:13px}
.sheet .chip.plain{padding:7px 12px}
.memo-row{display:grid;grid-template-columns:minmax(0,1fr) 148px;gap:8px;margin-top:6px}
.memo-row .field{padding:11px 12px}
.sheet .two .lab{margin-top:10px}
.sheet h2{font-size:18px;font-weight:700;margin:0}
.amount-wrap{display:flex;align-items:baseline;justify-content:center;gap:4px;margin-top:6px;padding:10px 14px;border:1.5px solid var(--line);border-radius:16px;background:var(--card);cursor:text}
.amount-wrap:focus-within{border-color:var(--focus)}
.amount{font:inherit;font-size:38px;font-weight:700;border:0;background:none;color:var(--ink);padding:0;min-width:1ch;max-width:calc(100% - 40px);letter-spacing:-.02em;text-align:left}
.amount:focus{outline:none}
.amount::placeholder{color:var(--line)}
.amount-wrap span{font-size:22px;font-weight:700}
.hint{min-height:20px;font-size:14px;color:var(--sub);font-weight:500}

/* tab bar */
.nav{position:relative;z-index:10;margin:0 -16px;background:var(--card);border-top:1px solid var(--line);padding-bottom:calc(env(safe-area-inset-bottom) * .4)}
.nav-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 74px 1fr 1fr;align-items:end;padding:4px 8px 2px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 0;font-size:11px;font-weight:500;color:var(--sub)}
.tab.on{color:var(--ink)}

/* ===== LOGIC_START (pure functions; tested separately) ===== */
function hashStr(str){   // FNV-1a: the same text gives the same number on every device

/* amount / people, rounded down for everyone; the leftover yen go one each to people picked by rotating from a start point that depends on `seed`

  var n = ids.length, base = Math.floor(amount / n), rem = amount - base * n;

function calcBalances(trip){
  var paid = {}, owed = {};

  trip.expenses.forEach(function(e){
    if (paid[e.payer] === undefined) return;
    paid[e.payer] += e.amount;
    splitShares(e.amount, e.split, e.id).forEach(function(s){ if (owed[s[0]] !== undefined) owed[s[0]] += s[1]; });
  });

  return { paid: paid, owed: owed, net: net };
}
/* ---- rounds of settlement ----

function netOf(trip, amount, payer, split, seed){

/* the current round: expenses not settled yet + adjustments not settled yet */

  trip.expenses.forEach(function(e){
    if (e.settleId && sid[e.settleId]) return;
    if (paid[e.payer] === undefined) return;
    paid[e.payer] += e.amount;
    splitShares(e.amount, e.split, e.id).forEach(function(s){ if (owed[s[0]] !== undefined) owed[s[0]] += s[1]; });
  });

    if (a.settleId && sid[a.settleId]) return;
    Object.keys(a.nets).forEach(function(id){ if (adj[id] !== undefined) adj[id] += a.nets[id]; });

}
/* closes the current round: everything not settled yet joins it. Returns the new settlement. */

/* the adjustment that a change to a settled expense causes (null when the expense is not settled, or the money does not change).

function expenseAdjustment(trip, oldE, newE, adjId, note, at){

function settle(net){
  var cr = [], db = [];

    if (net[id] > 0) cr.push({id: id, v: net[id]});
    else if (net[id] < 0) db.push({id: id, v: -net[id]});

  while (cr.length && db.length){
    cr.sort(function(a, b){ return b.v - a.v; });
    db.sort(function(a, b){ return b.v - a.v; });
    var c = cr[0], d = db[0], x = Math.min(c.v, d.v);
    out.push({ from: d.id, to: c.id, amount: x });

    if (d.v === 0) db.shift();

/* search: every space-separated word must appear in the title, category, payer, members, amount or date (full-width characters are normalised) */
function matchExpense(e, q, label){

  var hay = [e.title || '', label.cat, label.payer, label.split.join(' '), String(e.amount), e.date].join(' ').normalize('NFKC').toLowerCase();

function parseYen(s){

function tripCsv(trip, catName){

  var rows = [['日付', '内容', 'カテゴリ', '金額', '払った人', '割り勘の対象', '精算']];
  trip.expenses.slice().sort(function(a, b){ return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; }).forEach(function(e){
    rows.push([e.date, e.title, catName(e.cat), e.amount, nm(e.payer), e.split.map(nm).join('・'), roundNo(trip, e.settleId) ? '第' + roundNo(trip, e.settleId) + '回' : '未精算']);
  });
  rows.push([], ['精算（いまの回）', '払う人', '受け取る人', '金額']);
  settle(roundBalances(trip).net).forEach(function(p){ rows.push(['', nm(p.from), nm(p.to), p.amount]); });

/* CSV import (the file tripCsv writes, or anything shaped like it): 日付, 内容, カテゴリ, 金額, 払った人, 割り勘の対象. Stops at the first blank row (the settlement block follows it). */

  var rows = [], row = [], cell = '', q = false, i = 0, n;
  text = String(text).replace(/^\ufeff/, '');
  for (; i < text.length; i++){
    var c = text[i];
    if (q){ if (c === '"'){ if (text[i + 1] === '"'){ cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;

    var c = rows[r].map(function(x){ return x.trim(); });

/* push local changes (diff against what the server last had), then pull if somebody else changed it. Resolves 'ok' | 'offline' | 'gone'. */
async function shareSync(t){
  const sh = t.share; if (!sh) return 'ok';
  if (shareBusy[t.id]){ shareAgain[t.id] = true; return 'busy'; }
  shareBusy[t.id] = true;
  let result = 'ok';
  try {
    const rows = Sync.flatten([t]), ops = Sync.diff(sh.snap, rows);
    if (ops.length){ const r = await Share.ops(sh.token, ops); sh.snap = rows; sh.rev = r.rev; persist(); }
    const g = await Share.get(sh.token, sh.rev);
    if (!g.unchanged){
      if (ui.sheet) shareSync.later = true;                                  // do not swap data under an open form
      else if (!Sync.diff(sh.snap, Sync.flatten([t])).length) { applyRemote(t, Sync.assemble([g.trip])[0], g.rev); render(); }
    }
    if (sh.dirty){ sh.dirty = false; render(); }
    linkMe(t);
  } catch(e){
    if (e && e.status === 404){ result = 'gone'; unshare(t); flash('共有が終了しました。この端末には残っています。'); render(); }
    else { result = 'offline'; if (!sh.dirty){ sh.dirty = true; render(); } }
  } finally {
    shareBusy[t.id] = false;
    if (shareAgain[t.id]){ shareAgain[t.id] = false; shareSoon(); }
  }
  return result;
}
/* Tell the server which member of this shared trip is this LINE account, so settlement notices can reach them (once per sign-in and trip). */

    ui.reach = { id: id, ids: r.reachable, at: Date.now() }; if (!same && ui.view === 'trip' && ui.tripId === id && ui.tab === 'settle' && !ui.sheet) render(); }).catch(() => {});

async function startShare(t){

/* ---- LINE login + backup (worker/account.js). Logging in is optional; sharing by link never needs it. ---- */
const lineAcct = { login: false, user: null, waiting: false, count: null, last: null, push: null, remoteItems: [], bkErr: null };
const LINE_ATTEMPT = 'tabiwari.lineattempt', BK_SIGS = 'tabiwari.bksigs';
const sigOf = str => { let h = 5381; for (let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) | 0; return str.length + ':' + h; };
const readSigs = () => { try { return JSON.parse(lsGet(BK_SIGS)) || {}; } catch(e){ return {}; } };
function bkItem(t){
  if (t.share) return { kind: 'shared', token: t.share.token, me: t.share.me, name: t.name, start: t.start, end: t.end };
  const copy = JSON.parse(JSON.stringify(t)); delete copy.share; return { kind: 'local', trip: copy };
}
function bkSoon(){ clearTimeout(bkSoon.t); bkSoon.t = setTimeout(() => bkRun(), 4000); }
function bkRun(){ if (!bkRun.p) bkRun.p = bkRunInner().finally(() => { bkRun.p = null; }); return bkRun.p; }
/* Sends local changes to the backup. Returns true when everything went through; otherwise sets lineAcct.bkErr (shown in the account sheet) instead of failing silently.
   A batch that the server refuses as invalid is retried one trip at a time, so one bad trip cannot block the others. */
async function bkRunInner(){
  if (!lineAcct.user || bkRun.busy) return true; bkRun.busy = true;
  const failed = []; let err = null;
  try {
    const sigs = readSigs(), todo = [], nameOfTrip = id => { const t = state.trips.find(x => x.id === id); return t ? t.name : '旅行'; };
    state.trips.forEach(t => { const item = bkItem(t), sg = sigOf(JSON.stringify(item)); if (sigs[t.id] !== sg) todo.push({ id: t.id, item: item, sg: sg }); });
    const put = async part => { const r = await Line.backupPut(part.map(x => ({ id: x.id, item: x.item }))); part.forEach(x => { sigs[x.id] = x.sg; }); lsSet(BK_SIGS, JSON.stringify(sigs)); lineAcct.count = r.count; lineAcct.last = Date.now(); };
    for (let i = 0; i < todo.length; i += 20){
      const part = todo.slice(i, i + 20);
      try { await put(part); }
      catch(e){ if (!(e && e.status === 400)) throw e; for (const x of part){ try { await put([x]); } catch(e2){ if (e2 && e2.status === 400) failed.push(nameOfTrip(x.id)); else throw e2; } } }
    }
    const gone = readGone().filter(id => !state.trips.some(t => t.id === id));
    for (let i = 0; i < gone.length; i += 20){ const part = gone.slice(i, i + 20); try { await Line.backupPut([], [], part); lsSet(GONE_KEY, JSON.stringify(readGone().filter(id => part.indexOf(id) < 0))); } catch(e){ if (e && e.status === 401) throw e; } }
  } catch(e){
    if (e && e.status === 401){ lineAcct.user = null; flash(Line.errText(e)); render(); }
    else err = Line.errText(e);
  } finally { bkRun.busy = false; }
  const msg = err || (failed.length ? '「' + failed.join('」「') + '」は、バックアップできませんでした（大きすぎるか、形式が正しくありません）。' : null);
  if (msg && msg !== lineAcct.bkErr && !ui.sheet) flash(msg);
  lineAcct.bkErr = msg; return !msg;
}
async function lineInit(){
  try {
    const m = await Line.me(); lineAcct.login = !!m.login; lineAcct.user = m.user; lineAcct.push = m.push || null;
    linkDone = {}; if (m.user) shared().forEach(linkMe);
    if (m.user){ try { lineAcct.count = (await Line.backupGet()).items.length; } catch(e){} bkRun(); }
  } catch(e){ /* offline or no server: login simply is not offered */ }
  if (lsGet(LINE_ATTEMPT) && !lineAcct.user) linePoll(); else { lineAcct.waiting = false; }
  render(); refreshNtfHome(); checkRemote(true);
}
async function lineLogin(){
  try { const a = await Line.begin(); lsSet(LINE_ATTEMPT, JSON.stringify({ id: a.id, secret: a.secret, t: Date.now() })); location.href = a.url; }
  catch(e){ flash(Line.errText(e)); }
}
async function linePoll(){
  if (linePoll.running) return; linePoll.running = true; lineAcct.waiting = true; render();
  try {
    for (;;){
      let a = null; try { a = JSON.parse(lsGet(LINE_ATTEMPT)); } catch(e){}
      if (!a || Date.now() - a.t > 10 * 60 * 1000){ lsSet(LINE_ATTEMPT, null); break; }
      if (!document.hidden){
        try {
          const r = await Line.poll(a.id, a.secret);
          if (r.ok){ lsSet(LINE_ATTEMPT, null); lineAcct.waiting = false; await lineInit(); flash('LINEでログインしました'); lineOfferRestore(); return; }
        } catch(e){ if (e.status === 410){ lsSet(LINE_ATTEMPT, null); flash('ログインできませんでした。もう一度お試しください。'); break; } }
      }
      await new Promise(r => setTimeout(r, 1500));
    }
  } finally { linePoll.running = false; lineAcct.waiting = false; render(); }
}
/* ---- reminders for people who are logged in: this device's Web Push subscription (the server decides what to send, see worker/reminders.js) ---- */
async function ntfState(){

async function ntfOff(){

  if (sub){ try { await Line.pushUnsubscribe(sub.endpoint); } catch(e){} await sub.unsubscribe(); }
  return 'off';

}

const payKey = (n, p) => { const b = p.from + '-' + p.to + '-' + p.amount; return n === 1 ? b : n + ':' + b; };   // round 1 keeps the old key format, so earlier checkmarks still count

function xferList(t, pays, n){

  const row = (p, grouped) => { const k = payKey(n, p), on = !!t.paid[k];
    return '<div class="xfer ' + (on ? 'done' : '') + '"><span class="avs">' + (grouped ? av(t, p.from) : av(t, p.from) + av(t, p.to)) + '</span>' +

function tabSettle(t){

  const left = pays.filter(p => !t.paid[payKey(n, p)]).length;
  if (t.share && (!ui.reach || ui.reach.id !== t.id || Date.now() - ui.reach.at > 60000)) refreshReach(t);
  const me = meId(t), off = t.share && ui.reach && ui.reach.id === t.id && ui.reach.ids ? t.members.filter(m => m.id !== me && ui.reach.ids.indexOf(m.id) < 0) : [];

  if (!has) h += '<div class="panel"><b>未精算の支出はありません。</b><div class="sub">これから記録する支出は、第' + n + '回の精算になります。</div></div>';
  else if (!pays.length) h += '<div class="panel"><b>送金は必要ありません。</b><div class="sub">全員の支払いがちょうど同じです。</div></div>';

  if (has) h += '<button class="btn" data-a="settle-ask" style="margin-top:14px">この精算を完了する</button><div class="sub sm" style="margin-top:6px;text-align:center">完了すると、いまの支出が第' + n + '回にまとまります。</div>';

  if (has) h += '<div class="sec"><h2>ひとりずつの内訳<span>第' + n + '回</span></h2><div class="list">' + t.members.map(m => {
    const v = bal.net[m.id];
    return '<div class="item slim">' + av(t, m.id) + '<div class="grow"><div class="t">' + esc(m.name) + '</div><div class="sub sm">立て替え ' + yen(bal.paid[m.id]) + '・負担 ' + yen(bal.owed[m.id]) + (bal.adj[m.id] ? '・差額 ' + (bal.adj[m.id] > 0 ? '+' : '−') + Math.abs(bal.adj[m.id]).toLocaleString('ja-JP') + '円' : '') + '</div></div>' +
      '<div class="amt plus-or-minus ' + (v > 0 ? 'pos' : v < 0 ? 'neg' : '') + '">' + (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toLocaleString('ja-JP') + '円</div></div>';
  }).join('') + '</div></div>';
  if (ss.length) h += '<div class="sec"><h2>精算の履歴</h2><div class="list">' + ss.map((st, i) => ({ st: st, i: i })).reverse().map(x =>
    '<button class="item slim acc" data-a="settle-open" data-id="' + esc(x.st.id) + '"><div class="grow"><div class="t">第' + (x.i + 1) + '回の精算</div><div class="sub sm">' + fmtDate(x.st.at) + '・支出 ' + yen(x.st.total) + '・送金 ' + x.st.transfers.length + '件</div></div>' + icon('chev', 18) + '</button>').join('') + '</div></div>';
  return h;
}

function tabSave(t){
  const target = Math.ceil(t.budget / t.members.length);
  const sum = t.members.reduce((s, m) => s + (t.savings[m.id] || 0), 0), pct = Math.min(100, Math.round(sum / t.budget * 100));
  let h = '<div class="sec"><h2>旅行までの積立<span>1人 ' + yen(target) + ' が目標</span></h2><div class="panel"><div class="row between"><b>みんなの合計</b><span class="num">' + yen(sum) + '</span></div>' +
    '<div class="bar"><i style="width:' + pct + '%"></i></div><div class="sub" style="margin-top:6px">予算 ' + yen(t.budget) + ' の ' + pct + '%</div></div></div>' +
    '<div class="sec"><div class="list">';
  h += t.members.map(m => {
    const v = t.savings[m.id] || 0, p = Math.min(100, Math.round(v / target * 100));
    return '<div class="item">' + av(t, m.id) + '<div class="grow"><div class="t">' + esc(m.name) + '</div><div class="bar" style="margin-top:4px"><i style="width:' + p + '%"></i></div>' +
      '<div class="sub sm" style="margin-top:2px">' + yen(v) + '（' + p + '%）</div></div><button class="btn line" data-a="add-save" data-id="' + m.id + '" style="width:auto;padding:9px 14px;font-size:14px">記録</button></div>';
  }).join('') + '</div></div>';
  return h;
}

function splitHint(d){
  const a = parseYen(d.amount);
  if (!(a > 0)) return '金額を入れると、1人あたりの金額が出ます。';
  if (!d.split.length) return '割り勘の対象を選んでください。';
  const sh = splitShares(a, d.split, '').map(x => x[1]), lo = Math.min.apply(null, sh), hi = Math.max.apply(null, sh);
  return d.split.length === 1 ? '1人の分として記録します。' : '1人あたり ' + yen(lo) + (lo !== hi ? '〜' + yen(hi) : '') + '（' + d.split.length + '人で割り勘）';
}

  else if (a === 'toggle-split'){
    readSheet(); const v = el.getAttribute('data-v');
    if (s.data.all){ s.data.all = false; s.data.split = [v]; }   // from "全員" to one person: start the list with that person
    else { const ix = s.data.split.indexOf(v); if (ix >= 0) s.data.split.splice(ix, 1); else s.data.split.push(v); }
  }
  else if (a === 'save-exp'){
    readSheet(); const dd = s.data, amt = parseYen(dd.amount);
    if (!(amt > 0)) s.err = '金額を、1以上の数字で入力してください。';
    else if (!dd.split.length) s.err = '誰の分かを、1人以上選んでください。';
    else {
      const order = t.members.map(m => m.id), rec = { title: dd.title.trim(), amount: amt, payer: dd.payer, cat: dd.cat, date: dd.date || todayStr(),
        split: dd.split.slice().sort((x, y) => order.indexOf(x) - order.indexOf(y)) };
      if (s.editId){
        const x = t.expenses.filter(q => q.id === s.editId)[0], old = JSON.parse(JSON.stringify(x));
        const moneyChanged = old.amount !== rec.amount || old.payer !== rec.payer || old.split.join() !== rec.split.join();
        if (isSettled(t, old) && moneyChanged && !s.confirmSettled){ s.confirmSettled = true; render(); return; }   // closed round: ask first
        Object.assign(x, rec);
        const adj = expenseAdjustment(t, old, x, uid(), '「' + (rec.title || (CAT[rec.cat] || CAT.other)[2]) + '」の変更', todayStr());
        if (adj) t.adjustments = (t.adjustments || []).concat([adj]);
      }
      else t.expenses.push(Object.assign({ id: uid() }, rec));
      const wasEdit = !!s.editId; save(); ui.sheet = null; render(); flash(wasEdit ? '保存しました' : '記録しました'); return;
    }
  }
  else if (a === 'settled-cancel'){ s.confirmSettled = false; }
  else if (a === 'ask-del'){ readSheet(); s.confirmDel = true; }
  else if (a === 'del-exp'){
    const ix = t.expenses.findIndex(q => q.id === s.editId), gone = t.expenses[ix], tid = t.id;
    if (ix < 0){ ui.sheet = null; render(); return; }
    const adj = expenseAdjustment(t, gone, null, uid(), '「' + (gone.title || (CAT[gone.cat] || CAT.other)[2]) + '」の削除', todayStr());   // a closed round's expense: the difference goes to the current round
    if (adj) t.adjustments = (t.adjustments || []).concat([adj]);
    t.expenses = t.expenses.filter(q => q.id !== s.editId); save(); ui.sheet = null; render();
    flash('削除しました', () => { const tt = state.trips.find(x => x.id === tid); if (!tt || tt.expenses.some(q => q.id === gone.id)) return; tt.expenses.splice(Math.min(ix, tt.expenses.length), 0, gone);
      if (adj) tt.adjustments = (tt.adjustments || []).filter(a => a.id !== adj.id);   // undoing the deletion also takes the difference back
      save(); render(); flash('元に戻しました'); });
    return;
  }
  else if (a === 'undo'){ const f = ui.undo; ui.toast = null; ui.undo = null; toastN++; if (f) f(); else render(); return; }

  else if (a === 'toggle-paid'){ const k = el.getAttribute('data-k'); if (t.paid[k]) delete t.paid[k]; else t.paid[k] = true; save(); }
  else if (a === 'settle-ask'){ if (openItems(t).expenses.length || openItems(t).adjustments.length) ui.sheet = { type: 'settle-confirm', err: '' }; }
  else if (a === 'settle-go'){
    const n = (t.settlements || []).length + 1; confirmRound(t, uid(), todayStr()); ui.sheet = null; save(); render(); flash('第' + n + '回の精算を完了しました'); return;
  }
  else if (a === 'settle-open'){ ui.sheet = { type: 'settle-detail', id: id, err: '' }; }
  else if (a === 'add-save'){ ui.sheet = { type: 'save', id: id, err: '' }; }
  else if (a === 'quick-save'){ document.getElementById('f-save').value = el.getAttribute('data-v'); return; }
  else if (a === 'save-saving'){
    const n = parseYen(document.getElementById('f-save').value);
    if (!(n !== 0 && !isNaN(n))) s.err = '金額を数字で入力してください（例：5000）。';
    else { t.savings[s.id] = Math.max(0, (t.savings[s.id] || 0) + n); save(); ui.sheet = null; render(); flash('記録しました'); return; }
  }

  else if (a === 'settings'){ ui.sheet = { type: 'settings', err: '', confirmDel: false, data: { name: t.name, start: t.start, end: t.end, budget: String(t.budget) } }; }
  else if (a === 'rm-tmember'){ readSheet(); t.members = t.members.filter(m => m.id !== id); save(); }
  else if (a === 'save-settings'){
    readSheet(); const d = s.data, b = parseYen(d.budget);
    if (!d.name.trim()) s.err = '旅行の名前を入力してください。';
    else if (d.end < d.start) s.err = '帰着日は、出発日と同じか、それ以降にしてください。';
    else if (!(b > 0)) s.err = '予算を、1以上の数字で入力してください。';
    else {
      t.name = d.name.trim(); t.start = d.start; t.end = d.end; t.budget = b; save(); ui.sheet = null; render(); flash('保存しました'); return;
    }
  }
  else if (a === 'ask-del-trip'){ readSheet(); s.confirmDel = true; }
  else if (a === 'del-trip'){
    const ix = state.trips.findIndex(x => x.id === t.id), gone = t;
    state.trips = state.trips.filter(x => x.id !== t.id); lsSet(GONE_KEY, JSON.stringify(readGone().concat(gone.id))); save(); if (lineAcct.user) bkSoon(); ui.sheet = null; ui.view = 'home'; ui.tripId = null; render();
    flash('旅行を削除しました', () => { if (state.trips.some(x => x.id === gone.id)) return; state.trips.splice(Math.min(ix, state.trips.length), 0, gone); lsSet(GONE_KEY, JSON.stringify(readGone().filter(id => id !== gone.id))); const sg = readSigs(); delete sg[gone.id]; lsSet(BK_SIGS, JSON.stringify(sg)); save(); render(); flash('元に戻しました'); });
    return;
  }
  else if (a === 'close-sheet'){ ui.sheet = null; }
  render();
});

render();
bootShare();
</script>
</body>
</html>
